    title: '検索', wide: true,
    body: `<div class="grid3">
      <label class="field"><span>Vessel</span><select id="sV"><option value="">すべて</option>${S.vessels.map(v => `<option value="${v.id}" ${S.vessel?.id === v.id ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>

      if (to && v.date > to) return false;
      if (major && !p.major) return false;

  dlg.addEventListener('input', run);
  dlg.addEventListener('change', run);

/* ================= 履歴・Before/After 比較 ================= */
const RANK = { 1: 'Equipment No.', 2: '手動紐付け', 3: 'Equipment Name', 4: 'Location + Item', 5: 'Location', 9: 'その他' };
let cmpState = null;
function closeCompare() {
  const c = $('#cmp');
  window.removeEventListener('resize', cmpState?.onResize);
  c.hidden = true; c.innerHTML = '';
  cmpState = null;
}
async function openCompare(cur) {
  const vesselId = S.visit.vesselId;
  const visits = S.visits.filter(v => v.vesselId === vesselId && v.id !== S.visit.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const others = (await Promise.all(visits.map(v => Store.listPhotos(v.id)))).flat();
  const vmap = new Map(visits.map(v => [v.id, v]));
  const eq = eqById(cur.equipId);
  const rankOf = p => {
    const pe = eqById(p.equipId);
    if (eq && pe && (pe.id === eq.id || (eq.eqNo && pe.eqNo === eq.eqNo))) return 1;
    if ((cur.links || []).includes(p.id) || (p.links || []).includes(cur.id)) return 2;
    if (eq && pe && norm(pe.name) === norm(eq.name)) return 3;
    if (cur.loc && p.loc === cur.loc && p.items.some(i => cur.items.includes(i))) return 4;
    if (cur.loc && p.loc === cur.loc) return 5;
    return 9;
  };
  const cands = others.map(p => ({ p, r: rankOf(p), v: vmap.get(p.visitId) }));
  let showAll = false, sel = null, curImg = null, selImg = null;
  const c = $('#cmp');
  c.innerHTML = `<div class="pebar"><button data-x="close">閉じる</button><b>履歴・Before / After</b><label class="chk" style="color:#fff"><input type="checkbox" id="cmpAll">すべての過去写真</label></div>
    <div class="cmpbody"><div class="cmppair">
      <div class="cmpcol"><h4>BEFORE</h4><div class="cmpimg" id="cmpB"><span class="hint">右の一覧から選んでください</span></div><div class="cmpcap" id="cmpBc"></div></div>
      <div class="cmpcol"><h4>AFTER（今回）</h4><div class="cmpimg" id="cmpA"></div><div class="cmpcap" id="cmpAc"></div></div>
    </div><div class="cmplist" id="cmpList"></div></div>`;
  c.hidden = false;
  const locName = id => S.locMap.get(id)?.name || '未振り分け';
  const cap = (p, v) => `${v ? `${v.date}　${v.port || ''}\n` : ''}${locName(p.loc)}${eqById(p.equipId) ? '　' + eqLabel(eqById(p.equipId)) : ''}\n${p.comment || ''}`;
  const paintInto = (box, img, p) => {
    if (!img) return;
    const dpr = window.devicePixelRatio || 1;
    const cv = renderEdited(img, p.edit, box.clientWidth * dpr, box.clientHeight * dpr);
    cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
    box.innerHTML = ''; box.appendChild(cv);
  };
  const onResize = () => { paintInto($('#cmpA'), curImg, cur); if (sel) paintInto($('#cmpB'), selImg, sel.p); };
  cmpState = { onResize };
  window.addEventListener('resize', onResize);
  const drawList = () => {
    const list = cands.filter(x => showAll || x.r < 9).sort((a, b) => a.r - b.r || (b.v.date || '').localeCompare(a.v.date || '') || a.p.takenAt - b.p.takenAt);
    let h = '';
    if (!visits.length) h = '<p class="empty">この船の過去の訪船がありません。</p>';
    else if (!list.length) h = `<p class="empty">一致する過去写真がありません。<br>「すべての過去写真」をオンにすると、手動で紐付けできます。</p>`;
    let lastV = null;
    for (const x of list.slice(0, 300)) {
      if (x.v.id !== lastV) { h += `<div class="cmpv">${esc(x.v.date)}　${esc(x.v.port || '')}</div>`; lastV = x.v.id; }
      const linked = (cur.links || []).includes(x.p.id);
      h += `<div class="cmpi ${sel && sel.p.id === x.p.id ? 'on' : ''}" data-x="pick" data-id="${x.p.id}"><img data-thumb="${x.p.id}" alt=""><div class="r"><span class="rk r${x.r}">${RANK[x.r]}</span><div>${esc(locName(x.p.loc))}</div><div class="hint">${esc((x.p.comment || '').slice(0, 30))}</div>
        <button data-x="link" data-id="${x.p.id}" style="margin-top:4px;padding:3px 8px;font-size:12px">${linked ? '紐付け解除' : '紐付ける'}</button></div></div>`;
    }
    const box = $('#cmpList'); box.innerHTML = h; hydrate(box);
    return list;
  };
  const pick = async x => {
    sel = x; drawList();
    $('#cmpBc').textContent = cap(x.p, x.v);
    const img = await loadImg(await fullURL(x.p.id));
    if (sel !== x) return;
    selImg = img; paintInto($('#cmpB'), img, x.p);
  };
  c.onclick = async ev => {
    const b = ev.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'close') { closeCompare(); return; }
    const x = cands.find(y => y.p.id === b.dataset.id);
    if (b.dataset.x === 'link') {
      ev.stopPropagation();
      const on = !(cur.links || []).includes(x.p.id);
      cur.links = (cur.links || []).filter(i => i !== x.p.id); x.p.links = (x.p.links || []).filter(i => i !== cur.id);
      if (on) { cur.links.push(x.p.id); x.p.links.push(cur.id); }
      await Store.putPhoto(cur); await Store.putPhoto(x.p);
      x.r = rankOf(x.p);
      drawList(); toast(on ? '紐付けました' : '紐付けを解除しました');
    } else if (b.dataset.x === 'pick') pick(x);
  };
  c.querySelector('#cmpAll').addEventListener('change', e => { showAll = e.target.checked; drawList(); });
  $('#cmpAc').textContent = cap(cur, S.visit);
  const first = drawList()[0];
  curImg = await loadImg(await fullURL(cur.id));
  paintInto($('#cmpA'), curImg, cur);
  if (first) pick(first);
}

/* ================= 写真出力（ZIP） =================
   <船名_日付_港>/<大カテゴリ>/<場所>/<項目>_<連番>.jpg ＋ photo_list.csv */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  const dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));

/* ---- テンプレート解析：写真枠（スロット）を検出 ---- */
async function xlLoadTemplate() {
  let res;

  catch (e) { throw new XlError('Excelテンプレートを取得できません。通信状態を確認してください。'); }

    const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];

function setCellText(xml, ref, text, style) {

  nx = nx.replace(/<xf\b([^>]*)>/, (all, a) => `<xf${/applyAlignment=/.test(a) ? a : a + ' applyAlignment="1"'}>${alignXml}`);
  const idx = xfs.length;
  const out = stylesXml.replace(m[0], `<cellXfs count="${idx + 1}">${m[2]}${nx}</cellXfs>`);
  cache[key] = idx;
  return [out, idx];
}

/* ---- 写真の配置（contain・中央） ---- */
function anchorXml(tpl, slot, imgW, imgH, n, rid) {
  const col = slot.photo.c1;
  const fw = tpl.colPx(col) * EMU_PX;
  const rowsList = [];
  for (let r = slot.photo.r1; r <= slot.photo.r2; r++) rowsList.push([r, Math.round(tpl.rowPt(r) * EMU_PT)]);
  const fh = rowsList.reduce((a, x) => a + x[1], 0);
  const pad = XL.pad * EMU_PX;
  const k = Math.min((fw - pad * 2) / imgW, (fh - pad * 2) / imgH);
  const w = Math.round(imgW * k), h = Math.round(imgH * k);
  const x0 = Math.round((fw - w) / 2), y0 = Math.round((fh - h) / 2);
  const at = y => {
    let acc = 0;
    for (let i = 0; i < rowsList.length; i++) {
      const [r, hh] = rowsList[i];
      if (y < acc + hh || i === rowsList.length - 1) return { row: r - 1, off: Math.max(0, Math.min(hh, y - acc)) };
      acc += hh;
    }
  };
  const f = at(y0), t = at(y0 + h);
  return `<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${col}</xdr:col><xdr:colOff>${x0}</xdr:colOff><xdr:row>${f.row}</xdr:row><xdr:rowOff>${f.off}</xdr:rowOff></xdr:from>`
    + `<xdr:to><xdr:col>${col}</xdr:col><xdr:colOff>${x0 + w}</xdr:colOff><xdr:row>${t.row}</xdr:row><xdr:rowOff>${t.off}</xdr:rowOff></xdr:to>`
    + `<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n + 1}" name="Photo ${n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>`
    + `<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>`
    + `<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>`;
}
async function xlImage(p, max) {
  const blob = await blobForRender(p.id);
  if (!blob) throw new Error('写真データを読み込めません');
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const c = renderEdited(img, p.edit, max);
    return { blob: await canvasBlob(c, XL.imgQ), w: c.width, h: c.height };
  } finally { URL.revokeObjectURL(url); }
}
const slotName = (i, slot) => `${Math.floor(i / 2) + 1}段目${slot.side === 'L' ? '左' : '右'}`;
async function xlBuild(tpl, list, onProgress) {
  const files = new Map(tpl.files);
  let sheet = tpl.sheetXml;
  // タイトル
  sheet = setCellText(sheet, 'C1', xlTitle(S.visit), null);
  let styles = u8text(files.get('xl/styles.xml'));
  const cache = {};
  const anchors = [], rels = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i], slot = tpl.slots[i];
    onProgress(i, list.length);
    let im;
    try { im = await xlImage(p, (XL.imgMax[p.size] || XL.imgMax.std)); }
    catch (e) {
      console.error('Excel image error', p.id, e);
      const l = S.locMap.get(p.loc);
      throw new XlError(`${i + 1}枚目の写真（${l ? l.name : '未分類'}・${fmtFull(p.takenAt)}）の画像変換に失敗しました。\n${e.message || e}`);
    }
    const n = i + 1;
    files.set(`xl/media/hp_photo${n}.jpeg`, new Uint8Array(await im.blob.arrayBuffer()));
    rels.push(`<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/hp_photo${n}.jpeg"/>`);
    anchors.push(anchorXml(tpl, slot, im.w, im.h, n, `rId${n}`));
    let sLoc, sCom;
    [styles, sLoc] = addAlignStyle(styles, tpl.styleOf[slot.locRef] ?? 0, '<alignment horizontal="left" vertical="center" wrapText="1"/>', cache);
    [styles, sCom] = addAlignStyle(styles, tpl.styleOf[slot.comRef] ?? 0, '<alignment horizontal="left" vertical="top" wrapText="1"/>', cache);
    sheet = setCellText(sheet, slot.locRef, xlLocItem(p), sLoc);
    sheet = setCellText(sheet, slot.comRef, plainText(p.comment), sCom);
  }
  files.set('xl/styles.xml', textU8(styles));
  // 図形（写真）をシートに関連付け
  const dPath = 'xl/drawings/hp_drawing1.xml';
  files.set(dPath, textU8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors.join('')}</xdr:wsDr>`));
  files.set('xl/drawings/_rels/hp_drawing1.xml.rels', textU8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>`));
  const sheetName = tpl.sheetPath.split('/').pop();
  const sRelPath = tpl.sheetPath.replace(sheetName, `_rels/${sheetName}.rels`);
  let sRels = files.has(sRelPath) ? u8text(files.get(sRelPath)) : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  let drId = 'rIdHp1';
  while (sRels.includes(`Id="${drId}"`)) drId += 'x';
  sRels = sRels.replace('</Relationships>', `<Relationship Id="${drId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/hp_drawing1.xml"/></Relationships>`);
  files.set(sRelPath, textU8(sRels));
  if (/<drawing\b/.test(sheet)) throw new XlError('テンプレートに既存の図形があるため出力できません。');
  const after = ['<legacyDrawing', '<legacyDrawingHF', '<drawingHF', '<picture', '<oleObjects', '<controls', '<webPublishItems', '<tableParts', '<extLst', '</worksheet>'];
  const pos = Math.min(...after.map(t => sheet.indexOf(t)).filter(x => x >= 0));
  sheet = sheet.slice(0, pos) + `<drawing r:id="${drId}"/>` + sheet.slice(pos);
  if (!/xmlns:r=/.test(sheet.slice(0, 600))) sheet = sheet.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
  files.set(tpl.sheetPath, textU8(sheet));
  // Content Types
  let ct = u8text(files.get('[Content_Types].xml'));
  if (!/Extension="jpeg"/i.test(ct)) ct = ct.replace('</Types>', '<Default Extension="jpeg" ContentType="image/jpeg"/></Types>');
  ct = ct.replace('</Types>', `<Override PartName="/${dPath}" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
  files.set('[Content_Types].xml', textU8(ct));
  // 印刷範囲：写真を入れた最後のページまで
  const bottom = Math.max(...tpl.slots.slice(0, list.length).map(sl => sl.bottom));
  const pageEnd = tpl.breaks.find(b => b >= bottom) ?? bottom;
  let wb = u8text(files.get('xl/workbook.xml'));
  const qn = `'${XL.sheet.replace(/'/g, "''")}'`;
  const re = new RegExp(`(<definedName name="_xlnm\\.Print_Area" localSheetId="${tpl.sheetIndex}"[^>]*>)([^<]*)(</definedName>)`);
  if (re.test(wb)) wb = wb.replace(re, (a, o, v, c) => `${o}${v.replace(/\$[A-Z]+\$\d+\s*$/, m => m.replace(/\d+\s*$/, String(pageEnd)))}${c}`);
  else if (/<definedNames>/.test(wb)) wb = wb.replace('<definedNames>', `<definedNames><definedName name="_xlnm.Print_Area" localSheetId="${tpl.sheetIndex}">${qn}!$A$1:$H$${pageEnd}</definedName>`);
  files.set('xl/workbook.xml', textU8(wb));
  onProgress(list.length, list.length);
  return await makeZip([...files].map(([name, u8]) => ({ name, blob: new Blob([u8]) })));
}

const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
function dataURLToBlob(d) {
  const [h, b64] = d.split(',');
  const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

    for (let i = 0; i < S.photos.length; i++) {

      parts.push((i ? ',' : '') + JSON.stringify({ ...p, _blobs: blobs }));
    }

/* ================= クラウド同期（Supabase） =================
   ・端末内（IndexedDB）が主、変更は送信待ち（outbox）に記録して送信
   ・受信は records.updated_at（サーバー時刻）を基準に差分取得。同じデータは新しい方を採用
   ・写真本体は必要になったときに取得 */
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem('hp.' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('hp.' + k, JSON.stringify(v)); } catch (e) { /* 保存できない環境 */ } },
  del(k) { try { localStorage.removeItem('hp.' + k); } catch (e) { /* 保存できない環境 */ } }
};
const SB_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js';
const KIND_STORE = { vessel: 'vessels', visit: 'visits', photo: 'photos', equip: 'equipment' };
const Sync = {
  sb: null, user: null, state: 'off', err: '', busy: false, again: false, timer: null, deb: null, channel: null,
  enabled() { return !!(this.sb && this.user); },
  cfg() { return LS.get('sync.cfg') || {}; }
};
const outbox = () => LS.get('sync.outbox') || {};
function outboxAdd(key, op) {
  const ob = outbox(); ob[key] = op; LS.set('sync.outbox', ob);
  clearTimeout(Sync.deb); Sync.deb = setTimeout(() => syncNow(), 2500);
  syncUI();
}
function loadSupabase() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = SB_LIB; el.onload = () => res(); el.onerror = () => rej(new Error('Supabaseの読み込みに失敗しました（通信を確認してください）'));
    document.head.appendChild(el);
  });
}
async function syncInit() {
  const c = Sync.cfg();
  if (!c.url || !c.key) { syncUI(); return; }
  try {
    await loadSupabase();
    Sync.sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'hp.sb.auth' } });
    const { data } = await Sync.sb.auth.getSession();
    Sync.user = data.session ? data.session.user : null;
    Sync.sb.auth.onAuthStateChange((ev, sess) => { Sync.user = sess ? sess.user : null; syncUI(); });
    if (Sync.user) startSyncLoop();
  } catch (e) { Sync.state = 'error'; Sync.err = e.message; }
  syncUI();
}
function syncUI() {
  const b = $('#syncBadge'); if (!b) return;
  const c = Sync.cfg();
  b.hidden = !c.url;
  const n = Object.keys(outbox()).length;
  let t, cls;
  if (!Sync.user) { t = '☁ 未ログイン'; cls = 'warn'; }
  else if (Sync.state === 'syncing') { t = '☁ 同期中…'; cls = ''; }
  else if (!navigator.onLine || Sync.state === 'offline') { t = `☁ オフライン${n ? `（送信待ち${n}）` : ''}`; cls = 'warn'; }
  else if (Sync.state === 'error') { t = '☁ 同期エラー'; cls = 'err'; }
  else if (n) { t = `☁ 送信待ち ${n}`; cls = 'warn'; }
  else { t = '☁ 同期済'; cls = 'ok'; }
  b.textContent = t; b.className = cls;
  b.title = Sync.err || '';
}
function startSyncLoop() {
  clearInterval(Sync.timer);
  Sync.timer = setInterval(() => syncNow(), 60000);
  if (!Sync.channel) {
    try {
      Sync.channel = Sync.sb.channel('hp-records')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, () => { clearTimeout(Sync.deb); Sync.deb = setTimeout(() => syncNow(), 1200); })
        .subscribe();
    } catch (e) { /* リアルタイム受信が使えなくても定期同期で動く */ }
  }
  const c = Sync.cfg();
  if (LS.get('sync.inited') !== `${c.url}|${Sync.user.id}`) initialSync(); else syncNow();
}
async function fetchRemoteBlob(key) {
  const m = key.match(/^(.+):(f|t)$/);
  if (!m || !navigator.onLine) return null;
  try {
    const { data, error } = await Sync.sb.storage.from('photos').download(`${m[1]}/${m[2]}.jpg`);
    if (error || !data) return null;
    await LocalAdapter.putBlob(key, data);
    return data;
  } catch (e) { return null; }
}
async function pushOutbox() {
  const ob = outbox(), keys = Object.keys(ob);
  if (!keys.length) return;
  const sb = Sync.sb, done = [];
  // 写真本体を先に送る
  for (const k of keys.filter(x => x.startsWith('blob:'))) {
    const key = k.slice(5), b = await LocalAdapter.getBlob(key);
    if (b) {
      const [pid, t] = key.split(':');
      const { error } = await sb.storage.from('photos').upload(`${pid}/${t}.jpg`, b, { upsert: true, contentType: 'image/jpeg' });
      if (error) throw error;
    }
    done.push([k, ob[k]]);
  }
  const recKeys = keys.filter(x => !x.startsWith('blob:'));
  const rows = [], removeFiles = [];
  for (const k of recKeys) {
    const i = k.indexOf(':'), kind = k.slice(0, i), id = k.slice(i + 1);
    const o = ob[k] === 'del' ? null : await LocalAdapter.get(KIND_STORE[kind], id);
    if (!o) { rows.push({ id, kind, parent: null, data: { id }, deleted: true }); if (kind === 'photo') removeFiles.push(`${id}/f.jpg`, `${id}/t.jpg`); }
    else rows.push({ id, kind, parent: o.visitId || o.vesselId || null, data: o, deleted: false });
    done.push([k, ob[k]]);
  }
  for (let i = 0; i < rows.length; i += 200) {
    const { error } = await sb.from('records').upsert(rows.slice(i, i + 200), { onConflict: 'id' });
    if (error) throw error;
  }
  if (removeFiles.length) { try { await sb.storage.from('photos').remove(removeFiles); } catch (e) { /* 写真ファイルの削除失敗は無視 */ } }
  // 送信中に変更されたものは残す
  const now = outbox();
  for (const [k, op] of done) if (now[k] === op) delete now[k];
  LS.set('sync.outbox', now);
}
async function applyRemote(r, seen) {
  if (seen) seen.set(r.id, r);
  const store = KIND_STORE[r.kind]; if (!store) return false;
  if (outbox()[`${r.kind}:${r.id}`]) return false; // この端末の未送信の変更を優先
  const local = await LocalAdapter.get(store, r.id);
  if (r.deleted) {
    if (!local) return false;
    if (r.kind === 'photo') { await LocalAdapter.deletePhoto(r.id); dropCache(r.id); }
    else if (r.kind === 'visit') await LocalAdapter.deleteVisit(r.id);
    else if (r.kind === 'vessel') await LocalAdapter.deleteVessel(r.id);
    else await LocalAdapter.deleteEquip(r.id);
    return true;
  }
  const d = r.data || {};
  if (local && (local.updatedAt || 0) >= (d.updatedAt || 0)) return false;
  if (r.kind === 'vessel') await LocalAdapter.putVessel(d);
  else if (r.kind === 'visit') await LocalAdapter.putVisit(d);
  else if (r.kind === 'equip') await LocalAdapter.putEquip(d);
  else {
    await LocalAdapter.putPhoto(d);
    if (local && JSON.stringify(local.edit || {}) !== JSON.stringify(d.edit || {})) { await LocalAdapter.delBlob(r.id + ':t'); dropCache(r.id); }
  }
  return true;
}
async function pullChanges(seen) {
  let cursor = LS.get('sync.cursor') || '1970-01-01T00:00:00Z', changed = false;
  for (;;) {
    const { data, error } = await Sync.sb.from('records').select('*').gt('updated_at', cursor).order('updated_at', { ascending: true }).limit(500);
    if (error) throw error;
    for (const r of data) { if (await applyRemote(r, seen)) changed = true; cursor = r.updated_at; }
    LS.set('sync.cursor', cursor);
    if (data.length < 500) break;
  }
  return changed;
}
async function refreshFromStore() {
  S.vessels = await Store.listVessels();
  S.visits = await Store.listVisits();
  if (S.visit) {
    const v = S.visits.find(x => x.id === S.visit.id);
    if (!v) { S.visit = null; S.photos = []; S.equip = []; S.selected.clear(); S.tab = 'visits'; setVesselContext(); }
    else {
      S.visit = v; setVesselContext();
      S.photos = await Store.listPhotos(v.id);
      S.equip = S.vessel ? await Store.listEquip(S.vessel.id) : [];
      for (const id of [...S.selected]) if (!S.photos.some(p => p.id === id)) S.selected.delete(id);
    }
  } else {
    const first = sortedVisits()[0];
    if (first) { await openVisit(first.id); return; }
  }
  render();
}
async function syncNow() {
  if (!Sync.enabled()) return;
  if (Sync.busy) { Sync.again = true; return; }
  if (!navigator.onLine) { Sync.state = 'offline'; syncUI(); return; }
  Sync.busy = true; Sync.state = 'syncing'; syncUI();
  try {
    await pushOutbox();
    if (await pullChanges()) await refreshFromStore();
    Sync.state = 'ok'; Sync.err = ''; LS.set('sync.last', Date.now());
  } catch (e) {
    Sync.state = navigator.onLine ? 'error' : 'offline';
    Sync.err = e.message || String(e);
  } finally {
    Sync.busy = false; syncUI();
    if (Sync.again) { Sync.again = false; setTimeout(() => syncNow(), 500); }
  }
}
/* 初回：クラウドの内容を受信 → この端末だけのデータを送信 */
async function initialSync() {
  if (Sync.busy) return;
  Sync.busy = true; Sync.state = 'syncing'; syncUI();
  const prog = $('#progress');
  prog.hidden = false; $('#pText').textContent = 'クラウドのデータを受信中'; $('#pBar').style.width = '20%';
  try {
    LS.set('sync.cursor', '1970-01-01T00:00:00Z');
    const seen = new Map();
    await pullChanges(seen);
    $('#pText').textContent = 'この端末のデータを確認中'; $('#pBar').style.width = '50%';
    // 未使用の初期登録船は、クラウドに同名の船があれば削除（重複防止）
    const remoteVessels = [...seen.values()].filter(r => r.kind === 'vessel' && !r.deleted);
    const visits = await LocalAdapter.listVisits();
    for (const v of await LocalAdapter.listVessels()) {
      if (seen.has(v.id)) continue;
      const same = remoteVessels.some(r => norm(r.data.name || '') === norm(v.name));
      if (same && !visits.some(x => x.vesselId === v.id)) {
        for (const e of await LocalAdapter.listEquip(v.id)) await LocalAdapter.deleteEquip(e.id);
        await LocalAdapter.deleteVessel(v.id);
      }
    }
    // クラウドにない・端末の方が新しいデータを送信待ちへ
    const ob = {};
    const mark = (kind, o) => {
      const r = seen.get(o.id);
      const newer = !r || (!r.deleted && (o.updatedAt || 0) > ((r.data && r.data.updatedAt) || 0));
      if (newer) ob[`${kind}:${o.id}`] = 'up';
    };
    for (const v of await LocalAdapter.listVessels()) { mark('vessel', v); for (const e of await LocalAdapter.listEquip(v.id)) mark('equip', e); }
    for (const v of await LocalAdapter.listVisits()) {
      mark('visit', v);
      for (const p of await LocalAdapter.listPhotos(v.id)) {
        mark('photo', p);
        if (!seen.has(p.id)) { ob[`blob:${p.id}:f`] = 'up'; if (await LocalAdapter.getBlob(p.id + ':t')) ob[`blob:${p.id}:t`] = 'up'; }
      }
    }
    LS.set('sync.outbox', { ...outbox(), ...ob });
    const n = Object.keys(ob).length;
    $('#pText').textContent = n ? `クラウドへ送信中（${n}件）` : '仕上げ中'; $('#pBar').style.width = '75%';
    Sync.busy = false;
    await pushOutbox();
    const c = Sync.cfg();
    LS.set('sync.inited', `${c.url}|${Sync.user.id}`);
    LS.set('sync.last', Date.now());
    Sync.state = 'ok'; Sync.err = '';
    await refreshFromStore();
    toast(n ? `クラウド同期を開始しました（${n}件を送信）` : 'クラウド同期を開始しました');
  } catch (e) {
    Sync.state = navigator.onLine ? 'error' : 'offline'; Sync.err = e.message || String(e);
    toast('初回同期に失敗しました。通信を確認して「今すぐ同期」を押してください');
  } finally {
    Sync.busy = false; prog.hidden = true; syncUI();
  }
}
function openSync() {
  const c = Sync.cfg();
  const last = LS.get('sync.last');
  const n = Object.keys(outbox()).length;
  const dlg = openModal({
    title: 'クラウド同期（Supabase）',
    body: `${Sync.user ? `<div class="tankbox"><b>ログイン中：</b>${esc(Sync.user.email)}<br>
        <span class="hint">状態：${esc($('#syncBadge').textContent)}${Sync.err ? `（${esc(Sync.err)}）` : ''}<br>送信待ち：${n}件　最終同期：${last ? fmtFull(last) : '－'}</span></div>` : ''}
      <details ${c.url ? '' : 'open'} class="field"><summary><b>接続設定</b> <span class="hint">${c.url ? esc(c.url) : '未設定'}</span></summary>
        <label class="field" style="margin-top:8px"><span>Project URL</span><input id="sbUrl" value="${esc(c.url || '')}" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off"></label>
        <label class="field"><span>anon public key</span><input id="sbKey" value="${esc(c.key || '')}" placeholder="eyJhbGciOi..." autocomplete="off"></label>
        <button data-m="savecfg">接続設定を保存</button>
      </details>
      ${c.url && !Sync.user ? `<label class="field"><span>メールアドレス</span><input id="sbMail" type="email" autocomplete="username" value="${esc(LS.get('sync.mail') || '')}"></label>
        <label class="field"><span>パスワード</span><input id="sbPass" type="password" autocomplete="current-password"></label>
        <p class="hint">アカウントは管理者（Supabase管理画面の Authentication）が登録します。</p>` : ''}`,
    footer: Sync.user
      ? `<button data-m="logout">ログアウト</button><span class="sp"></span><button data-act="close">閉じる</button><button class="primary" data-m="now">今すぐ同期</button>`
      : `<span class="sp"></span><button data-act="close">閉じる</button>${c.url ? '<button class="primary" data-m="login">ログイン</button>' : ''}`
  });
  dlg.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'savecfg') {
      const url = dlg.querySelector('#sbUrl').value.trim().replace(/\/+$/, ''), key = dlg.querySelector('#sbKey').value.trim();
      if (!/^https:\/\/.+/.test(url) || key.length < 20) { alert('Project URL と anon public key を確認してください'); return; }
      if (Sync.user && c.url !== url && !confirm('接続先を変更するとログアウトします。よろしいですか？')) return;
      if (Sync.sb && c.url !== url) { try { await Sync.sb.auth.signOut(); } catch (x) { /* 無視 */ } Sync.sb = null; Sync.user = null; Sync.channel = null; }
      LS.set('sync.cfg', { url, key });
      closeModal();
      await syncInit();
      openSync();
    } else if (m === 'login') {
      const email = dlg.querySelector('#sbMail').value.trim(), password = dlg.querySelector('#sbPass').value;
      if (!email || !password) { alert('メールアドレスとパスワードを入力してください'); return; }
      b.disabled = true;
      try {
        if (!Sync.sb) { await syncInit(); if (!Sync.sb) throw new Error(Sync.err || '接続設定を確認してください'); }
        const { data, error } = await Sync.sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        LS.set('sync.mail', email);
        Sync.user = data.user;
        closeModal();
        startSyncLoop();
      } catch (x) {
        b.disabled = false;
        alert(/invalid/i.test(x.message || '') ? 'メールアドレスまたはパスワードが違います' : `ログインできませんでした：${x.message || x}`);
      }
    } else if (m === 'logout') {
      const pend = Object.keys(outbox()).length;
      if (pend && !confirm(`送信待ちが ${pend}件あります。ログアウトすると、再ログインするまで送信されません。ログアウトしますか？`)) return;
      clearInterval(Sync.timer);
      try { if (Sync.channel) await Sync.sb.removeChannel(Sync.channel); } catch (x) { /* 無視 */ }
      Sync.channel = null;
      await Sync.sb.auth.signOut();
      Sync.user = null; Sync.state = 'off';
      closeModal(); syncUI(); toast('ログアウトしました');
    } else if (m === 'now') {
      closeModal();
      if (LS.get('sync.inited') !== `${c.url}|${Sync.user.id}`) await initialSync(); else { await syncNow(); toast(Sync.state === 'ok' ? '同期しました' : `同期できませんでした：${Sync.err}`); }
    }
  });
}

/* ================= イベント ================= */
function bind() {
  document.addEventListener('click', async e => {
    if (!$('#menu').hidden && !e.target.closest('#menu')) { $('#menu').hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); }
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.closest('#menu')) { $('#menu').hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); }
    const a = t.dataset.act;
    switch (a) {
      case 'toggle': toggle(t.dataset.id); break;
      case 'view': e.stopPropagation(); openViewer(unassigned().map(x => x.id), t.dataset.id); break;
      case 'cell':
        if (S.selected.size) assignCell(t.dataset.l, t.dataset.i);
        else if (S.cellMap.get(t.dataset.l + '|' + t.dataset.i)?.length) openCell(t.dataset.l, t.dataset.i);
        else toast('このマスにはまだ写真がありません。未振り分けの写真を選んでからタップすると振り分けられます');
        break;
      case 'ctab': S.catTab = t.dataset.tab; renderMatrix(); $('#matrixPane').querySelector('.mwrap')?.scrollTo(0, 0); break;
      case 'rowlist': openRowList(t.dataset.l); break;
      case 'collist': openColList(t.dataset.i); break;
      case 'showAllLocs': S.onlyFilled = false; renderMatrix(); break;
      case 'todo': {
        const ids = S.photos.filter(needsInput).sort((a, b) => a.takenAt - b.takenAt).map(p => p.id);
        if (ids.length) openViewer(ids, ids[0], null, { queue: true });
        break;
      }
      case 'ich': t.classList.toggle('on'); break;
      case 'clearSel': S.selected.clear(); render(); break;
      case 'assign': openAssign([...S.selected]); break;
      case 'tab': S.tab = t.dataset.tab; render(); break;
      case 'new': openNewVisit(); break;
      case 'visitInfo': openVisitInfo(); break;
      case 'vessels': openVessels(); break;
      case 'equip': openEquipment(); break;
      case 'search': openSearch(); break;
      case 'backup': openBackup(); break;
      case 'export': openExport(); break;
      case 'xlalbum': if (S.visit) openXlAlbum(); else toast('訪船を選択してください'); break;
      case 'xlorder': if (S.visit) openXlOrder(); else toast('訪船を選択してください'); break;
      case 'xlVisit': {
        const id = t.dataset.id;
        if (!S.visit || S.visit.id !== id) { await openVisit(id); S.tab = 'visits'; render(); }
        openXlAlbum();
        break;
      }
      case 'sync': openSync(); break;
      case 'menu': { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); e.stopPropagation(); return; }
      case 'shoot': openCam(); break;
      case 'openVisit': {
        const id = t.dataset.id;
        S.tab = isMobile() ? 'tray' : 'matrix';
        if (!S.visit || S.visit.id !== id) await openVisit(id); else render();
        break;
      }
      case 'exportVisit': {
        const id = t.dataset.id;
        if (!S.visit || S.visit.id !== id) { await openVisit(id); S.tab = 'visits'; render(); }
        openExport();
        break;
      }
      case 'close': closeModal(); break;
    }
  });
  document.addEventListener('change', e => { if (e.target.id === 'onlyFilled') { S.onlyFilled = e.target.checked; renderMatrix(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#pe').hidden) return;
      if (!$('#menu').hidden) { $('#menu').hidden = true; return; }
      if (!$('#cmp').hidden) { closeCompare(); return; }
      if (!$('#cam').hidden) { if (!$('#camLp').hidden) $('#camLp').hidden = true; else if (!$('#camSheet').hidden) hideSheet(); else exitCam(); return; }
      closeModal();
    }
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.classList?.contains('th')) { e.preventDefault(); toggle(t.dataset.id); }
  });
  $('#tray').addEventListener('change', e => {
    const g = e.target.dataset.g; if (g === undefined) return;
    S.groups[+g].items.forEach(x => e.target.checked ? S.selected.add(x.id) : S.selected.delete(x.id));
    render();
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('#visitSel').addEventListener('change', async e => { if (S.tab === 'visits') S.tab = isMobile() ? 'tray' : 'matrix'; await openVisit(e.target.value); });
  $('#vlVessel').addEventListener('change', renderVisits);
  $('#vlQ').addEventListener('input', renderVisits);
  $('#gapIn').addEventListener('input', e => { S.gapMin = +e.target.value; $('#gapVal').textContent = S.gapMin; renderTray(); });
  $('#fileLbl').addEventListener('click', e => { if (!S.visit) { e.preventDefault(); openNewVisit(); } });
  $('#fileIn').addEventListener('change', async e => { await importFiles(e.target.files); e.target.value = ''; });
  let dragN = 0;
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('#dropHint').hidden = false; } });
  window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#dropHint').hidden = true; } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dropHint').hidden = true; if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });
}


/* ---- Webアプリ（ホーム画面）用 ---- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker?.register('./sw.js').catch(() => {}); });
}
// 端末のストレージが自動削除されないよう永続化を依頼
navigator.storage?.persist?.().catch(() => {});

(async function boot() {
  const ok = await Store.init();
  if (!ok) {
    const n = $('#notice');
    n.hidden = false;
    n.textContent = 'この環境では端末に保存できないため、ページを閉じるとデータが消えます。';
  }
  S.vessels = await Store.listVessels();
  for (const v of S.vessels) if (normalizeVessel(v)) await Store.putVessel(v);
  if (!S.vessels.length) {
    // 初期登録（設備構成は仮の値。船マスタで実船に合わせて修正すること）
    for (const [name, flag] of [['LIMONE', 'Panama'], ['OCEAN RALLY', 'Liberia'], ['ORIENTAL BEAUTY', 'Panama']]) {
      const v = newVessel(name); v.flag = flag; v.locations = buildLocations(v); v.seed = true;
      await Store.putVessel(v); S.vessels.push(v);
    }
  }
  S.visits = await Store.listVisits();
  for (const vi of S.visits) {
    const vs = S.vessels.find(x => x.id === vi.vesselId);
    if (!vs || !vi.locations || !vi.cats || (vi.tplVer || 0) >= TPL_VER) continue;
    syncVisitLocs(vi, vs);
    vi.tplVer = TPL_VER; vi.locVer = LOC_VER; await Store.putVisit(vi);
  }
  try { await autoImportEq(); } catch (e) { /* 機器リスト取り込み失敗時も起動は継続 */ }
  bind();
  bindCam();
  const first = sortedVisits()[0];
  if (first) await openVisit(first.id); else render();
  syncInit();
  window.addEventListener('online', () => { syncUI(); syncNow(); });
  window.addEventListener('offline', () => syncUI());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
})();
