<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Housen Photo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Housen">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--hull:#16324F;--steel:#5E6B75;--deck:#E9EDF0;--paper:#fff;--line:#CDD5DB;--signal:#F0B400;--rust:#B8401F;--ink:#1B2530;--head:#F4F6F8;--sea:#2E6E8E}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--deck);color:var(--ink);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button,.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled),.btn:hover{border-color:var(--steel)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--hull);color:#fff;border-color:var(--hull)}
.danger{color:var(--rust);border-color:#E3B8AA}
:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
.hint{font-size:13px;color:var(--steel)}
.sp{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0}

.top{display:flex;gap:10px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--hull);color:#fff;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.04em;margin-right:4px}
.top select{background:#0F2640;color:#fff;border:1px solid #3B5673;border-radius:6px;padding:7px 10px;min-width:240px;max-width:100%}
.top .actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.top button,.top .btn{background:transparent;color:#fff;border-color:#3B5673}
.top .primary{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.notice{background:#FFF3CD;color:#5A4500;padding:8px 16px;font-size:13px}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;min-width:0}
main>*,.pv>*,.asg>*,.cmpbody>*,.grid2>*,.grid3>*{min-width:0}
.pane{min-height:0;overflow:auto}
#matrixPane{padding:16px 20px}
#trayPane{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column}

.phead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.phead h1{margin:0;font-size:26px;letter-spacing:.02em;color:var(--hull)}
.pmeta{color:var(--steel);font-size:14px}
.mtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:13px}
.ctabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:0 0 auto;padding:6px 11px;border-radius:16px;font-size:12px;font-weight:700;letter-spacing:.03em;background:var(--paper);color:var(--hull)}
.ctab span{margin-left:5px;font-size:10px;background:var(--deck);border-radius:8px;padding:0 5px;font-weight:400}
.ctab.on{background:var(--hull);color:#fff;border-color:var(--hull)}
.ctab.on span{background:rgba(255,255,255,.2)}
.ln{word-break:break-word}
.hbtn{display:block;width:100%;background:none;border:0;border-radius:0;padding:0;margin:0;text-align:inherit;font:inherit;color:inherit;white-space:normal;cursor:pointer}
.hbtn:hover .ln,.mx thead .hbtn:hover{text-decoration:underline}
.mx thead .hbtn{text-align:center}
.lc{display:block;font-size:9px;color:var(--steel);font-weight:400;letter-spacing:.04em}
.cell .dot{position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--rust);box-shadow:0 0 0 1.5px #fff}
.todo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FBEAE4;border:1px solid #EFC6B8;border-radius:8px;padding:6px 10px;margin:0 0 8px;font-size:13px}
.todo>span:first-child{color:var(--rust);font-weight:700}
.todo b{font-weight:700;color:var(--ink)}
.todo button{padding:5px 10px;font-size:13px}
.trayhead .todo{margin:0 0 8px}
.citems{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tag.xl{background:#DDF1E4;color:#1B6B3A}
.xlmark{position:absolute;right:3px;top:3px;background:#1E8449;color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;line-height:15px}
.cthumb{position:relative}
.ci.xl .cthumb{box-shadow:0 0 0 3px #1E8449}
.cell .xlc{position:absolute;right:2px;top:2px;background:#1E8449;color:#fff;font-style:normal;font-size:9px;font-weight:700;border-radius:3px;padding:0 3px;line-height:13px}
.xlchk{color:#1B6B3A;font-weight:700}
.xlbtn{border-color:#1E8449;color:#1B6B3A}
.xo-row{display:grid;grid-template-columns:64px 96px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--deck)}
.xo-no{font-weight:700;color:var(--hull);font-size:18px;text-align:center;line-height:1.1}
.xo-no small{display:block;font-size:10px;font-weight:400;color:var(--steel)}
.xo-row img{width:96px;height:72px;object-fit:contain;background:var(--deck);border-radius:4px}
.xo-txt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13px}
.xo-txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xo-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.xo-btns button{padding:6px 10px}
.xlgo{background:#1E8449;border-color:#1E8449;color:#fff}
@media (max-width:820px){.xo-row{grid-template-columns:44px 72px 1fr;}.xo-row img{width:72px;height:54px}.xo-btns{grid-column:1 / -1;grid-template-columns:repeat(4,1fr)}}
.tag.fl{background:#FBEAE4;color:var(--rust)}
.th .nc{position:absolute;right:0;bottom:0;background:var(--rust);color:#fff;font-size:9px;padding:0 3px}
#pvFlags .tag{margin-left:4px}
#camBurst{flex:0 0 auto}
#camBurst.on{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.shotwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#camMode{font-size:11px;color:var(--signal);min-height:1em;font-weight:700}
#camPend{display:block;font-size:11px;color:#C9D3DC;text-align:center;min-height:1em}
.camsize{display:flex;flex-direction:column;gap:4px;width:84px}
.camsize button{padding:5px 0;font-size:11px;border-radius:14px;background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.4)}
.camsize button.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.camsize button[data-v="detail"].on{background:var(--signal);border-color:var(--signal)}
.li{display:flex;gap:4px;margin-bottom:6px;align-items:stretch}
.li input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.li button{padding:4px 9px}
.catbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--head)}
.catbox .ctabs{flex-wrap:wrap;overflow:visible}
.lcs{flex:0 0 58px;min-width:0;padding:4px 2px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px}
.lea{align-self:center;font-size:10px;color:var(--sea);border:1px solid var(--sea);border-radius:3px;padding:0 4px;flex:0 0 auto}
#leList{max-height:40vh;max-height:40dvh;overflow:auto}
.mtools button{padding:5px 10px;font-size:13px}
.welcome{max-width:520px;margin:10vh auto;text-align:center;padding:0 16px}
.welcome h2{color:var(--hull);margin:0 0 8px}
.welcome p{color:var(--steel)}

#assignBanner{position:sticky;top:0;left:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--signal);color:var(--ink);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:700}
#assignBanner button{font-weight:400}

.mwrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;max-width:100%;width:max-content;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px);-webkit-overflow-scrolling:touch}
table.mx{border-collapse:separate;border-spacing:0}
.mx th,.mx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.mx thead th{position:sticky;top:0;background:var(--head);z-index:3;font-size:11px;padding:5px 2px;min-width:60px;max-width:60px;text-align:center;line-height:1.25;white-space:normal}
.mx thead th.none{color:var(--steel);font-weight:400}
.mx tbody th{position:sticky;left:0;background:var(--head);z-index:2;text-align:left;padding:3px 8px;font-size:12px;line-height:1.25;min-width:170px;max-width:170px;font-weight:700}
.mx thead th.corner{left:0;z-index:4;text-align:left;color:var(--steel);font-weight:400;padding-left:8px;min-width:170px;max-width:170px}
.mx tr.grp th,.mx tr.grp td{background:var(--hull);color:#fff;border-color:#2A4A6B}
.mx tr.grp th{padding:0}
.catbtn{display:flex;width:100%;gap:8px;align-items:center;background:transparent;border:0;color:#fff;padding:6px 10px;font-size:13px;font-weight:700;letter-spacing:.03em;text-align:left;border-radius:0}
.catbtn .n{margin-left:auto;font-weight:400;font-size:12px;opacity:.85}
.rowcount{font-size:10px;color:var(--steel);font-weight:400;margin-left:4px}
.cell{display:block;width:60px;height:44px;border:0;border-radius:0;padding:0;position:relative;background:var(--paper);overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .cnt{position:absolute;right:3px;bottom:3px;background:var(--hull);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;font-weight:700}
.cell:hover{background:#F2F6F9}
.assigning .cell{background:repeating-linear-gradient(-45deg,#FFF3C9 0 8px,#fff 8px 16px)}
.assigning .cell img{opacity:.55}
.assigning .cell:hover{box-shadow:inset 0 0 0 4px var(--signal)}
.bd{display:inline-block;font-style:normal;font-size:10px;font-weight:700;line-height:15px;width:15px;text-align:center;border-radius:3px;margin-left:3px;vertical-align:1px;color:#fff}
.bd.enc{background:var(--sea)}.bd.dan{background:var(--rust)}.bd.per{background:#7A5A00}

.trayhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.trayhead h2{font-size:15px;margin:0 0 6px;color:var(--hull)}
.gap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--steel)}
.gap input{flex:1}
#tray{padding:4px 14px 16px;flex:1}
.group{padding:10px 0;border-bottom:1px dashed var(--line)}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;cursor:pointer}
.ghead input{width:18px;height:18px;margin:0}
.gcount{color:var(--steel);margin-left:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.th{position:relative;aspect-ratio:4/3;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--deck);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .t{position:absolute;left:0;bottom:0;background:rgba(22,50,79,.82);color:#fff;font-size:11px;padding:0 4px}
.th.on{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal)}
.th.on::after{content:"✓";position:absolute;top:3px;left:3px;background:var(--signal);color:var(--ink);width:20px;height:20px;border-radius:50%;font-size:13px;font-weight:700;display:grid;place-items:center}
.th .zoom{position:absolute;top:3px;right:3px;width:26px;height:26px;padding:0;border-radius:4px;background:rgba(255,255,255,.92);font-size:13px;line-height:24px}
.empty{color:var(--steel);padding:20px 2px;font-size:14px}
#selbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--signal);font-weight:700}
#selbar button{font-weight:400}
#tabs{display:none}

/* 場所ピッカー・項目チップ */
.lp{display:flex;flex-direction:column;gap:6px;min-height:0}
.lprow{display:flex;gap:6px}
.lprow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.lprow select{flex:0 0 42%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.lplist{overflow:auto;max-height:46vh;max-height:46dvh;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.lpg{position:sticky;top:0;background:var(--hull);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;letter-spacing:.03em}
.lpi{display:flex;width:100%;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--deck);border-radius:0;text-align:left;padding:9px 10px;background:var(--paper)}
.lpi small{color:var(--steel);margin-left:auto;font-size:11px}
.lpi.on{background:#FFF3C9;font-weight:700;box-shadow:inset 4px 0 0 var(--signal)}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.ich{padding:5px 10px;border-radius:14px;font-size:13px;background:var(--paper)}
.ich.on{background:var(--hull);color:#fff;border-color:var(--hull)}

/* モーダル */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,30,48,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--paper);border-radius:10px;width:min(580px,100%);max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;min-width:0}
.dlg.wide{width:min(1120px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:16px;color:var(--hull)}
.dlg header .x{margin-left:auto;padding:4px 10px}
.dlg .body{padding:16px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.dlg footer{display:flex;gap:8px;align-items:center;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--steel);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.err{color:var(--rust);font-size:13px;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.asg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.asg h4,.vm h4{margin:0 0 8px;font-size:14px;color:var(--hull)}
.vtable{width:100%;border-collapse:collapse;font-size:14px}
.vtable th,.vtable td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.vtable th{font-size:12px;color:var(--steel);font-weight:400}
.tankbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.trow{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap}
.trow .chk{min-width:150px;font-weight:700;padding-bottom:8px}
.tf{display:flex;flex-direction:column;font-size:12px;color:var(--steel)}
.tf input{color:var(--ink);width:170px;padding:7px 9px;border:1px solid var(--line);border-radius:6px}
.tf select{color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.tankbox .hint{margin-top:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ci label{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.cthumb{padding:0;border:0;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:var(--deck)}
.cthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{font-size:11px;background:var(--deck);color:var(--hull);border-radius:3px;padding:0 5px}
.tag.ex{background:#F6DDD5;color:var(--rust)}

/* 写真ビューア */
.pv{display:grid;grid-template-columns:1fr 340px;gap:18px}
.pvstage{background:#0F1E30;border-radius:6px;display:flex;justify-content:center;align-items:center;min-height:200px;height:62vh;height:62dvh;overflow:hidden}
.pvstage canvas{max-width:100%;max-height:100%;display:block}
.pvtools{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pvpos{font-size:13px;color:var(--steel);margin-left:4px}
.pno{overflow-wrap:anywhere;font-weight:700;color:var(--hull);font-size:15px;letter-spacing:.02em;word-break:break-all}
.meta{font-size:12px;color:var(--steel);margin-bottom:12px;word-break:break-all}
.locbtn{width:100%;text-align:left;display:flex;align-items:center;gap:6px;padding:9px 10px;white-space:normal;flex-wrap:wrap}
.locbtn small{color:var(--steel)}
.inlp{margin-top:8px;border:2px solid var(--signal);border-radius:8px;padding:8px}

/* 写真編集 */
#pe{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;z-index:90;background:#0B1624;color:#fff;display:flex;flex-direction:column}
.pebar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.pebar b{flex:1;text-align:center}
.pebar button{background:transparent;color:#fff;border-color:#3B5673}
.pebar .primary{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.pestage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pestage canvas{position:absolute;touch-action:none}
.petools{background:#12233A;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.perow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.perow button{background:#1D3654;color:#fff;border-color:#2F4E72;padding:7px 10px;font-size:13px;flex:0 0 auto}
.perow button.on{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:700}
.perow .sep{width:1px;align-self:stretch;background:#2F4E72;flex:0 0 1px;margin:0 2px}
.perow label{display:flex;align-items:center;gap:6px;font-size:13px;flex:0 0 auto}
.perow input[type=range]{width:120px}
.sw{width:30px;height:30px;padding:0!important;border-radius:50%!important;border:2px solid #fff!important}
.sw.on{box-shadow:0 0 0 3px var(--signal)}

/* 撮影モード */
#cam{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;background:#000;z-index:80;color:#fff}
.camstage{position:absolute;inset:0}
.camstage video,.camstage img{width:100%;height:100%;object-fit:contain;display:block;position:absolute;inset:0;background:#000}
.camguide{position:absolute;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none;border-radius:2px}
.camfb{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;color:#C9D3DC;padding:0 24px;line-height:1.6}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.8;transition:none}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
.camtop button{background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.4)}
#camLocBtn{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;background:rgba(15,38,64,.85)}
.cambar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7))}
.camlast{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}

.camsheet{position:absolute;left:0;right:0;bottom:0;max-height:66vh;max-height:66dvh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;padding:12px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 10px;border-radius:14px;font-size:13px;background:var(--deck);border-color:var(--deck)}
.camrow{display:flex;gap:8px}
.camrow button{flex:1;padding:11px 6px;white-space:normal}
.camrow .big{padding:14px;font-weight:700;font-size:16px}
.camrow.sm button{padding:8px 4px;font-size:13px}
.camrow button{font-size:14px}
.camsheet .ich{padding:4px 9px;font-size:12px}
.camsheet .ichips{gap:5px}
.camsheet .chips button{font-size:12px;padding:3px 9px}
.camlp{position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));gap:8px;z-index:3}
.camlp .lp{flex:1}
.camlp .lplist{max-height:none;flex:1}
.camlphead{display:flex;gap:8px;align-items:center}

#progress{position:fixed;inset:0;background:rgba(15,30,48,.55);display:grid;place-items:center;z-index:95}
.pbox{background:var(--paper);border-radius:10px;padding:20px 24px;width:min(360px,90vw)}
.pbox p{margin:0 0 10px}
.bar{height:8px;background:var(--deck);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hull);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hull);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#dropHint{position:fixed;inset:12px;border:4px dashed var(--signal);border-radius:14px;background:rgba(22,50,79,.35);z-index:40;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:700;pointer-events:none}

.top{position:relative}
#menu{position:absolute;right:16px;top:calc(100% - 4px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:6px;z-index:30;min-width:240px}
#menu button{background:var(--paper);color:var(--ink);border:0;text-align:left;padding:10px 12px}
#menu button:hover{background:var(--deck)}
details summary{cursor:pointer}

/* 比較 */
#cmp{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;z-index:85;background:#0B1624;color:#fff;display:flex;flex-direction:column}
.cmpbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px}

.cmpcol{display:flex;flex-direction:column;min-height:0}
.cmpcol h4{margin:0 0 6px;font-size:13px;letter-spacing:.05em;color:var(--signal)}
.cmpimg{flex:1;min-height:0;background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cmpimg canvas{max-width:100%;max-height:100%}
.cmpcap{font-size:12px;color:#C9D3DC;margin-top:6px;min-height:3em;white-space:pre-wrap}
.cmplist{background:var(--paper);color:var(--ink);overflow:auto;padding:10px}
.cmpv{font-size:12px;font-weight:700;color:var(--hull);margin:10px 0 4px}
.cmpi{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.cmpi.on{border-color:var(--signal);background:#FFF8E1}
.cmpi img{width:72px;height:54px;object-fit:cover;border-radius:4px;background:var(--deck)}
.cmpi .r{font-size:11px}
.rk{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:0 5px;color:#fff;background:var(--sea)}
.rk.r2{background:#6A4C93}.rk.r3{background:#2E7D32}.rk.r4{background:#7A5A00}.rk.r5{background:var(--steel)}.rk.r9{background:#9AA5AE}

/* 検索結果 */
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.sr{display:grid;grid-template-columns:80px 1fr;gap:8px;text-align:left;padding:6px;white-space:normal;align-items:start}
.sr img{width:80px;height:60px;object-fit:cover;border-radius:4px;background:var(--deck)}
.sr small{display:block;color:var(--steel);font-size:11px}
.eqc{display:flex;gap:6px;flex-wrap:wrap}
.eqc input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.eqc button{padding:6px 10px}
.eqlist{flex-basis:100%;max-height:36vh;max-height:36dvh;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.eqlist .lpi span{flex:0 1 auto}
.eqlist .lpi small{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#eqVessel,#eqSys{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);max-width:100%}
.eqtable{width:100%;border-collapse:collapse;font-size:13px}
.eqtable th,.eqtable td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.eqtable th{font-size:11px;color:var(--steel);font-weight:400;position:sticky;top:0;background:var(--paper)}

#visitsPane{grid-column:1 / -1;padding:16px 20px}
body.view-visits #matrixPane,body.view-visits #trayPane{display:none}
#syncBadge{font-size:12px}
#syncBadge.ok{border-color:#5FA87A}
#syncBadge.warn{background:rgba(240,180,0,.2);border-color:var(--signal)}
#syncBadge.err{background:rgba(184,64,31,.35);border-color:#E3B8AA}
.top button.on{background:rgba(255,255,255,.15);border-color:#fff}
.vhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.vhead h1{margin:0;font-size:22px;color:var(--hull)}
.vfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.vfilter select,.vfilter input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.vfilter input{flex:1;min-width:160px}
#visitList{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.vcard{display:flex;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vcard.cur{border-color:var(--hull);box-shadow:inset 4px 0 0 var(--signal)}
.vmain{flex:1;min-width:0;display:flex;gap:10px;align-items:center;border:0;border-radius:0;padding:10px;text-align:left;white-space:normal;background:transparent}
.vthumb{flex:0 0 84px;height:63px;border-radius:6px;overflow:hidden;background:var(--deck);display:grid;place-items:center;font-size:10px;color:var(--steel)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.vinfo b{font-size:16px;color:var(--hull)}
.vdate{font-size:13px}
.vstats{font-size:12px;color:var(--steel)}
.vflags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tag.ok{background:#E3F1E6;color:#2E7D32}
.vact{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px;border-left:1px solid var(--deck)}
.vact button{padding:6px 10px;font-size:13px}

<script>
'use strict';
/* ================= 保存層 =================
   アプリは必ず Store のメソッドだけでデータを読み書きする。
   保存先の実装（アダプタ）を差し替えれば、画面側を変えずに保存先を変更できる。

   Store インターフェース（全メソッド Promise を返す）
     init()                                  → 利用可否 true/false
     listVessels() / putVessel(v) / deleteVessel(id)
     listVisits()  / putVisit(v)  / deleteVisit(id)   ※写真も削除
     listPhotos(visitId) / allPhotos() / getPhoto(id) / putPhoto(p) / deletePhoto(id)
     listEquip(vesselId) / allEquip() / putEquip(e) / deleteEquip(id)
     putBlob(key, blob) / getBlob(key) / delBlob(key)  key = "<photoId>:f"(写真) / ":t"(サムネイル)
   各レコードは id と updatedAt を持つ（同期時の新旧判定に使用）。

   移行予定（SharePointAdapter）
     GitHub Pages → Microsoft 365 ログイン(MSAL) → Microsoft Graph → SharePoint
     ・vessels / visits / photos / equipment → SharePoint リスト（または JSON ファイル）
     ・blobs → ドキュメントライブラリ（例 /Housen/<Vessel>/<Date>/<photoId>.jpg）
     ・圏外では LocalAdapter に保存し、通信回復後に送信キューで同期
*/
const LocalAdapter = (() => {
  let db = null;
  const mem = { vessels: new Map(), visits: new Map(), photos: new Map(), blobs: new Map(), equipment: new Map() };
  async function init() {
    try {
      db = await new Promise((res, rej) => {
        const r = indexedDB.open('housen-photo', 2);
        r.onupgradeneeded = () => {
          const d = r.result, has = n => d.objectStoreNames.contains(n);
          if (!has('vessels')) d.createObjectStore('vessels', { keyPath: 'id' });
          if (!has('visits')) d.createObjectStore('visits', { keyPath: 'id' });
          if (!has('photos')) d.createObjectStore('photos', { keyPath: 'id' }).createIndex('visitId', 'visitId');
          if (!has('blobs')) d.createObjectStore('blobs');
          if (!has('equipment')) d.createObjectStore('equipment', { keyPath: 'id' }).createIndex('vesselId', 'vesselId');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      return true;
    } catch (e) { db = null; return false; }
  }
  function tx(name, mode, fn) {
    return new Promise((res, rej) => {
      const t = db.transaction(name, mode);
      const req = fn(t.objectStore(name));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const all = n => db ? tx(n, 'readonly', s => s.getAll()) : Promise.resolve([...mem[n].values()]);
  const put = (n, o) => db ? tx(n, 'readwrite', s => s.put(o)) : (mem[n].set(o.id, o), Promise.resolve());
  const del = (n, id) => db ? tx(n, 'readwrite', s => s.delete(id)) : (mem[n].delete(id), Promise.resolve());
  const api = {
    init,
    get: (n, id) => db ? tx(n, 'readonly', s => s.get(id)) : Promise.resolve(mem[n].get(id)),
    listVessels: () => all('vessels'), putVessel: v => put('vessels', v), deleteVessel: id => del('vessels', id),
    listVisits: () => all('visits'), putVisit: v => put('visits', v),
    listPhotos: vid => db ? tx('photos', 'readonly', s => s.index('visitId').getAll(vid)) : Promise.resolve([...mem.photos.values()].filter(x => x.visitId === vid)),
    putPhoto: p => put('photos', p),
    allPhotos: () => all('photos'),
    getPhoto: id => db ? tx('photos', 'readonly', s => s.get(id)) : Promise.resolve(mem.photos.get(id)),
    listEquip: vid => db ? tx('equipment', 'readonly', s => s.index('vesselId').getAll(vid)) : Promise.resolve([...mem.equipment.values()].filter(x => x.vesselId === vid)),
    allEquip: () => all('equipment'),
    putEquip: e => put('equipment', e),
    deleteEquip: id => del('equipment', id),
    async deletePhoto(id) {
      await del('photos', id);
      for (const k of ['o', 'f', 't']) await api.delBlob(id + ':' + k);
    },
    putBlob: (k, b) => db ? tx('blobs', 'readwrite', s => s.put(b, k)) : (mem.blobs.set(k, b), Promise.resolve()),
    getBlob: k => db ? tx('blobs', 'readonly', s => s.get(k)) : Promise.resolve(mem.blobs.get(k)),
    delBlob: k => db ? tx('blobs', 'readwrite', s => s.delete(k)) : (mem.blobs.delete(k), Promise.resolve()),
    async deleteVisit(id) {
      for (const ph of await api.listPhotos(id)) await api.deletePhoto(ph.id);
      await del('visits', id);
    }
  };
  return api;
})();
function createStore(adapter) {
  const stamp = o => { o.updatedAt = Date.now(); return o; };
  return {
    ...adapter,
    backend: 'local',
    putVessel: v => adapter.putVessel(stamp(v)),
    putVisit: v => adapter.putVisit(stamp(v)),
    putPhoto: p => adapter.putPhoto(stamp(p)),
    putEquip: e => adapter.putEquip(stamp(e))
  };
}
/* 同期用：変更を送信待ち（outbox）に記録する。受信した内容は LocalAdapter に直接書く */
function trackStore(store) {
  const q = (kind, id, op = 'up') => { if (Sync.enabled()) outboxAdd(`${kind}:${id}`, op); };
  return {
    ...store,
    putVessel: async v => { await store.putVessel(v); q('vessel', v.id); },
    putVisit: async v => { await store.putVisit(v); q('visit', v.id); },
    putPhoto: async p => { await store.putPhoto(p); q('photo', p.id); },
    putEquip: async e => { await store.putEquip(e); q('equip', e.id); },
    deleteVessel: async id => { await store.deleteVessel(id); q('vessel', id, 'del'); },
    deleteEquip: async id => { await store.deleteEquip(id); q('equip', id, 'del'); },
    deletePhoto: async id => { await store.deletePhoto(id); q('photo', id, 'del'); },
    deleteVisit: async id => {
      for (const p of await store.listPhotos(id)) q('photo', p.id, 'del');
      await store.deleteVisit(id); q('visit', id, 'del');
    },
    putBlob: async (k, b) => { await store.putBlob(k, b); if (/:(f|t)$/.test(k)) q('blob', k); }
  };
}
const Store = trackStore(createStore(LocalAdapter));

const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  let h = `<div class="phead"><h1>${esc(v.vesselName)}</h1><span class="pmeta">${esc(v.date)}${v.port ? '　' + esc(v.port) : ''}　分類済み ${done} / ${S.photos.length}枚</span></div>`;
  h += todoBar();
  if (n) h += `<div id="assignBanner"><span>${n}枚を選択中。タブで区画を選び、マス目をタップ</span><button class="primary" data-act="assign">一覧から選ぶ</button><button data-act="clearSel">解除</button></div>`;
  h += `<div class="ctabs" role="tablist">${TABS.map(t => `<button role="tab" aria-selected="${t.id === tab.id}" class="ctab ${t.id === tab.id ? 'on' : ''}" data-act="ctab" data-tab="${t.id}">${t.label}${tabCnt[t.id] ? `<span>${tabCnt[t.id]}</span>` : ''}</button>`).join('')}</div>`;
  h += `<div class="mtools"><label class="chk"><input type="checkbox" id="onlyFilled" ${S.onlyFilled ? 'checked' : ''}>写真のある場所のみ</label>${n && S.onlyFilled ? '<span class="hint">振り分け中はすべての場所を表示</span>' : ''}</div>`;
  if (!locs.length) {
    queueMicrotask(() => keepTabVisible(pane));
    pane.innerHTML = h + `<p class="empty">${tab.id === 'ALL' ? 'まだ分類済みの写真はありません。' : `${esc(tab.label)} に写真はありません。`}<br><button data-act="showAllLocs" style="margin-top:8px">すべての場所を表示</button></p>`;
    return;
  }
  h += `<div class="mwrap"><table class="mx ${n ? 'assigning' : ''}"><thead><tr><th class="corner">場所</th>${cols.map(c => `<th class="${c.id ? '' : 'none'}" title="${esc(c.en)}"><button class="hbtn" data-act="collist" data-i="${c.id}">${esc(c.short)}</button></th>`).join('')}</tr></thead><tbody>`;
  for (const l of locs) {
    const rc = rowCnt.get(l.id) || 0;
    h += `<tr><th><button class="hbtn" data-act="rowlist" data-l="${l.id}"><span class="ln">${esc(l.name)}</span>${attrBadges(l)}${rc ? `<span class="rowcount">${rc}</span>` : ''}${tab.id === 'ALL' ? `<small class="lc">${esc(catName(l.cat))}</small>` : ''}</button></th>`;
    for (const c of cols) {
      const arr = map.get(l.id + '|' + c.id) || [];
      h += `<td><button class="cell" data-act="cell" data-l="${l.id}" data-i="${c.id}" aria-label="${esc(l.name)} ${esc(c.en)} ${arr.length}枚">${arr.length ? `<img data-thumb="${arr[arr.length - 1].id}" alt=""><span class="cnt">${arr.length}</span>${arr.some(needsComment) ? '<i class="dot" title="未コメントあり"></i>' : ''}${arr.some(p => p.excel) ? `<i class="xlc" title="Excel出力に使う写真 ${arr.filter(p => p.excel).length}枚">X${arr.filter(p => p.excel).length}</i>` : ''}` : ''}</button></td>`;
    }
    h += '</tr>';
  }
  pane.innerHTML = h + '</tbody></table></div>';
  hydrate(pane);
  keepTabVisible(pane);
}
function keepTabVisible(pane) {
  const bar = pane.querySelector('.ctabs'), on = bar?.querySelector('.ctab.on');

function groupsOf(list) {

    if (!cur || ph.takenAt - cur.end > S.gapMin * 60000) { cur = { items: [], start: ph.takenAt, end: ph.takenAt }; g.push(cur); }

}

/* ================= 訪船記録一覧 ================= */
let vlToken = 0;
async function renderVisits() {
  const my = ++vlToken;
  const sel = $('#vlVessel'), cur = sel.value;
  const cnt = new Map(); S.visits.forEach(v => cnt.set(v.vesselId, (cnt.get(v.vesselId) || 0) + 1));
  sel.innerHTML = `<option value="">すべての船（${S.visits.length}件）</option>` + S.vessels.map(v => `<option value="${v.id}" ${v.id === cur ? 'selected' : ''}>${esc(v.name)}（${cnt.get(v.id) || 0}件）</option>`).join('');
  const photos = await Store.allPhotos();
  if (my !== vlToken) return;
  const by = new Map();
  photos.forEach(p => { if (!by.has(p.visitId)) by.set(p.visitId, []); by.get(p.visitId).push(p); });
  const vf = sel.value, q = norm($('#vlQ').value);
  const list = sortedVisits().filter(v => (!vf || v.vesselId === vf) && (!q || norm(`${v.vesselName} ${v.port || ''} ${v.date}`).includes(q)));
  $('#vlCount').textContent = `${list.length}件`;
  const box = $('#visitList');
  if (!S.visits.length) { box.innerHTML = '<p class="empty">まだ訪船記録がありません。「新規訪船」から作成してください。</p>'; return; }
  if (!list.length) { box.innerHTML = '<p class="empty">条件に合う訪船記録がありません。</p>'; return; }
  box.innerHTML = list.map(v => {
    const ps = (by.get(v.id) || []).sort((a, b) => a.takenAt - b.takenAt);
    const ids = new Set((v.locations || []).map(l => l.id));
    const un = ps.filter(p => !(p.loc && ids.has(p.loc))).length, nc = ps.filter(needsComment).length, mj = ps.filter(p => p.major).length;
    const nLoc = new Set(ps.filter(p => p.loc && ids.has(p.loc)).map(p => p.loc)).size;
    const cover = ps[0];
    const range = ps.length ? `${fmtTime(ps[0].takenAt)}〜${fmtTime(ps[ps.length - 1].takenAt)}` : '';
    return `<div class="vcard ${S.visit && S.visit.id === v.id ? 'cur' : ''}">
      <button class="vmain" data-act="openVisit" data-id="${v.id}">
        <span class="vthumb">${cover ? `<img data-thumb="${cover.id}" alt="">` : '<span>No photo</span>'}</span>
        <span class="vinfo"><b>${esc(v.vesselName)}</b><span class="vdate">${esc(v.date)}${v.port ? '　' + esc(v.port) : ''}</span>
          <span class="vstats">写真 ${ps.length}枚${ps.length ? `・${nLoc}か所` : ''}${range ? `・${range}` : ''}</span>
          <span class="vflags">${un ? `<span class="tag fl">未分類 ${un}</span>` : ''}${nc ? `<span class="tag fl">未コメント ${nc}</span>` : ''}${mj ? `<span class="tag ex">Major ${mj}</span>` : ''}${ps.some(p => p.excel) ? `<span class="tag xl">Excel ${ps.filter(p => p.excel).length}</span>` : ''}${ps.length && !un && !nc ? '<span class="tag ok">入力完了</span>' : ''}${S.visit && S.visit.id === v.id ? '<span class="tag">表示中</span>' : ''}</span></span>
      </button>
      <div class="vact"><button class="xlbtn" data-act="xlVisit" data-id="${v.id}" ${ps.some(p => p.excel) ? '' : 'disabled'} title="Excel Photo Album">Excel</button><button data-act="exportVisit" data-id="${v.id}" ${ps.length ? '' : 'disabled'}>出力</button></div>
    </div>`;
  }).join('');
  hydrate(box);
}

/* ================= 訪船の切替 ================= */
function setVesselContext() {
  S.vessel = S.visit ? S.vessels.find(x => x.id === S.visit.vesselId) || null : null;
  S.locs = S.visit ? (S.visit.locations || vesselLocs(S.vessel)) : [];
  S.cats = S.visit ? (S.visit.cats || (S.vessel && S.vessel.cats) || []) : [];
  S.locMap = new Map(S.locs.map(l => [l.id, l]));
}
async function openVisit(id) {
  S.visit = S.visits.find(x => x.id === id) || null;
  S.selected.clear();
  clearCaches();
  setVesselContext();
  if (S.visit && S.vessel && (!S.visit.locations || !S.visit.cats)) { S.visit.cats = clone(S.vessel.cats); S.visit.locations = clone(vesselLocs(S.vessel)); await Store.putVisit(S.visit); setVesselContext(); }
  S.photos = S.visit ? await Store.listPhotos(id) : [];
  S.equip = S.vessel ? await Store.listEquip(S.vessel.id) : [];
  for (const p of S.photos) {
    const it = (p.items || []).filter(i => ITEM_IDS.has(i));
    if (it.length !== (p.items || []).length) { p.items = it; await Store.putPhoto(p); }
  }
  S.catTab = 'ALL';
  render();
}
function toggle(id) { S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); render(); }

async function assignCell(locId, itemId) {
  const ids = [...S.selected];
  for (const id of ids) {
    const ph = S.photos.find(x => x.id === id); if (!ph) continue;
    if (ph.loc !== locId) { ph.loc = locId; ph.items = itemId ? [itemId] : []; }
    else if (itemId && !ph.items.includes(itemId)) ph.items.push(itemId);
    await Store.putPhoto(ph);
  }
  S.selected.clear();
  if (isMobile() && unassigned().length) S.tab = 'tray';
  render();
  toast(`${ids.length}枚を「${S.locMap.get(locId).name}${itemId ? ' × ' + itemName(itemId) : ''}」に振り分けました`);
}

const locPickerHTML = (cats = S.cats) => `<div class="lp"><div class="lprow"><input type="search" class="lpq" placeholder="検索（例: h3, 2f, paint, fpt）" autocomplete="off" enterkeyhint="search"><select class="lpcat" aria-label="カテゴリ"><option value="">全カテゴリ</option>${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="lplist" role="listbox"></div></div>`;
function mountLocPicker(root, value, onPick, locs, cats) {
  const q = root.querySelector('.lpq'), cat = root.querySelector('.lpcat'), list = root.querySelector('.lplist');
  let cur = value;
  const draw = () => {
    const searching = !!norm(q.value);
    const order = new Map((cats || S.cats).map((c, i) => [c.id, i]));
    let arr = searchLocs(locs || S.locs, q.value);
    if (!norm(q.value)) arr = arr.map((l, i) => [l, i]).sort((a, b) => (order.get(a[0].cat) ?? 99) - (order.get(b[0].cat) ?? 99) || a[1] - b[1]).map(x => x[0]);
    if (cat.value) arr = arr.filter(l => l.cat === cat.value);
    let h = '', last = null;
    for (const l of arr) {
      if (!searching && l.cat !== last) { h += `<div class="lpg">${esc(catName(l.cat, cats))}</div>`; last = l.cat; }
      h += `<button type="button" class="lpi ${l.id === cur ? 'on' : ''}" role="option" aria-selected="${l.id === cur}" data-loc="${l.id}"><span>${esc(l.name)}</span>${attrBadges(l)}${searching ? `<small>${esc(catName(l.cat, cats))}</small>` : ''}</button>`;
    }
    list.innerHTML = h || '<p class="empty" style="padding:12px">該当する場所がありません</p>';
  };
  q.addEventListener('input', draw);
  cat.addEventListener('change', draw);
  list.addEventListener('click', e => { const b = e.target.closest('[data-loc]'); if (!b) return; cur = b.dataset.loc; draw(); onPick(cur); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); list.querySelector('[data-loc]')?.click(); } });
  draw();
  if (cur) list.querySelector('.lpi.on')?.scrollIntoView({ block: 'center' });
  return { focus: () => q.focus(), set(v) { cur = v; draw(); } };
}

      const on = body.querySelector('#leTabs .ctab.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      const rows = v.locations.map((l, i) => ({ l, i })).filter(x => x.l.cat === leCat);
      body.querySelector('#leList').innerHTML = rows.length ? rows.map((x, k) => `<div class="li"><input data-li="${x.i}" value="${esc(x.l.name)}" aria-label="場所名">${x.l.auto ? '<span class="lea" title="設備構成から自動生成">自動</span>' : ''}<select class="lcs" data-lcat="${x.i}" aria-label="大カテゴリを変更" title="大カテゴリを変更">${v.cats.map(c => `<option value="${c.id}" ${c.id === x.l.cat ? 'selected' : ''}>${esc(c.code || c.name)}</option>`).join('')}</select><button data-m="leup" data-i="${x.i}" ${k ? '' : 'disabled'} aria-label="上へ">↑</button><button data-m="ledown" data-i="${x.i}" ${k < rows.length - 1 ? '' : 'disabled'} aria-label="下へ">↓</button><button data-m="ledel" data-i="${x.i}" aria-label="削除">✕</button></div>`).join('') : '<p class="empty" style="padding:8px 0">このカテゴリに場所はありません。</p>';
      body.querySelector('#vCount').textContent = `（大${v.cats.length}・小${v.locations.length}）`;
    };
    body._drawLE = drawLE;
    body._leCat = c => { leCat = c; drawLE(); };
    body._curCat = () => leCat;
    const read = () => {
      v.name = body.querySelector('#vName').value.trim(); v.imo = body.querySelector('#vImo').value.trim();
      v.flag = body.querySelector('#vFlag').value.trim(); v.cls = body.querySelector('#vCls').value.trim();
      v.holds = Math.max(0, Math.min(12, +body.querySelector('#vHolds').value || 0));
      v.cranes = Math.max(0, Math.min(8, +body.querySelector('#vCranes').value || 0));
      v.gens = Math.max(0, Math.min(6, +body.querySelector('#vGens').value || 0));
      t.fpt = body.querySelector('#tFpt').checked; t.apt = body.querySelector('#tApt').checked;
      
      body.querySelectorAll('[data-tk]').forEach(el => { t[el.dataset.tk][el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
      for (const tt of TANK_TYPES) {
        const c = t[tt.key], nos = parseNos(c.nos), sides = SIDES[c.side] || SIDES.ps;
        const el = body.querySelector(`[data-prev="${tt.key}"]`);
        el.textContent = !c.on ? '登録しない' : !nos.length ? 'Tank No. を入力してください' :
          `${nos.length * sides.length}基：${nos.slice(0, 3).map(i => `${tt.pre} No.${i}${sides[0] ? ' ' + sides.join('/') : ''}`).join('、')}${nos.length > 3 ? ' …' : ''}`;
      }
      v.locations = mergeLocs(v.locations, buildLocations(v), v.locRemoved, v.cats);
      body._drawLE && body._drawLE();
    };
    body.oninput = e => {
      if (e.target.id === 'vAcc' || e.target.id === 'vCompass') {
        const n = +body.querySelector('#vAcc').value, cp = body.querySelector('#vCompass').checked;
        applyDeckLayout(v, n, cp);
        body._drawLE();
        toast(`A${n > 1 ? '〜' + deckLetter(n - 1) : ''} Deck${cp ? '・Compass Deck' : ''} の構成に振り分けました`);
        return;
      }
      const li = e.target.dataset.li;
      if (li !== undefined) { v.locations[+li].name = e.target.value; return; }
      const lc = e.target.dataset.lcat;
      if (lc !== undefined) {
        const [loc] = v.locations.splice(+lc, 1);
        loc.cat = e.target.value;
        insertLoc(v.locations, loc, v.cats);
        const to = v.cats.find(c => c.id === loc.cat);
        toast(`${loc.name} を ${to ? to.name : ''} に移動しました`);
        drawLE();
        return;
      }
      if (e.target.id === 'catName' || e.target.id === 'catCode') {
        const c = v.cats.find(x => x.id === body._curCat());
        if (c) { if (e.target.id === 'catName') c.name = e.target.value; else c.code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); }
        const tb = body.querySelector(`#leTabs .ctab.on`); if (tb && c) tb.firstChild.textContent = c.name || '（名称未設定）';
        return;
      }
      read();
    };
    body.onchange = null; // 入力は oninput で反映済み（change での再描画はタップを取りこぼすため行わない）
    read();
    body._cur = v;
  };
  body.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    switch (b.dataset.m) {
      case 'add': { const nv = newVessel(''); nv.locations = buildLocations(nv); formView(nv); break; }
      case 'lecat': body._leCat(b.dataset.cat); break;
      case 'catadd': {
        const v = body._cur, id = 'K-u-' + uid();
        v.cats.push({ id, key: null, name: '', code: '' });
        body._leCat(id);
        body.querySelector('#catName').focus();
        break;
      }
      case 'catdel': {
        const v = body._cur, id = body._curCat(), c = v.cats.find(x => x.id === id), n = v.locations.filter(l => l.cat === id).length;
        if (!c || !confirm(`大カテゴリ「${c.name || '名称未設定'}」${n ? `と小カテゴリ ${n}件` : ''}を削除しますか？`)) return;
        v.locations.filter(l => l.cat === id && l.auto).forEach(l => { v.locRemoved = [...new Set([...(v.locRemoved || []), l.id])]; });
        v.locations = v.locations.filter(l => l.cat !== id);
        v.cats = v.cats.filter(x => x.id !== id);
        body._leCat((v.cats[0] || {}).id);
        break;
      }
      case 'catleft': case 'catright': {
        const v = body._cur, i = v.cats.findIndex(x => x.id === body._curCat()), j = i + (b.dataset.m === 'catleft' ? -1 : 1);
        if (i < 0 || j < 0 || j >= v.cats.length) return;
        [v.cats[i], v.cats[j]] = [v.cats[j], v.cats[i]];
        body._drawLE();
        break;
      }
      case 'leadd': {
        const v = body._cur, cat = body._curCat();
        if (!cat) { alert('先に大カテゴリを追加してください'); return; }
        const corder = new Map(v.cats.map((c, i) => [c.id, i]));
        let pos = -1; v.locations.forEach((l, i) => { if (l.cat === cat) pos = i; });
        if (pos < 0) v.locations.forEach((l, i) => { if ((corder.get(l.cat) ?? 99) < corder.get(cat)) pos = i; });
        v.locations.splice(pos + 1, 0, { id: 'L-u-' + uid(), cat, name: '', aliases: [], enc: false, dan: false, per: false, auto: false });
        body._drawLE();
        body.querySelector(`#leList input[data-li="${pos + 1}"]`)?.focus();
        break;
      }
      case 'ledel': {
        const v = body._cur, i = +b.dataset.i, l = v.locations[i];
        if (l.auto) v.locRemoved = [...new Set([...(v.locRemoved || []), l.id])];
        v.locations.splice(i, 1); body._drawLE(); break;
      }
      case 'leup': case 'ledown': {
        const v = body._cur, i = +b.dataset.i, L = v.locations, d = b.dataset.m === 'leup' ? -1 : 1;
        let j = i + d;
        while (j >= 0 && j < L.length && L[j].cat !== L[i].cat) j += d;
        if (j >= 0 && j < L.length) { [L[i], L[j]] = [L[j], L[i]]; body._drawLE(); }
        break;
      }
      case 'lereset': {
        const v = body._cur;
        if (!confirm('この船の大カテゴリ・小カテゴリを標準構成に戻します。手動で追加・変更した内容は失われます。よろしいですか？')) return;
        v.locRemoved = []; v.cats = defaultCats(v.accDecks || DEF_DECKS, v.compassDeck !== false); v.locations = buildLocations(v); body._leCat(v.cats[0].id); break;
      }
      case 'edit': formView(clone(S.vessels.find(x => x.id === b.dataset.id))); break;
      case 'back': body.oninput = body.onchange = null; listView(); break;
      case 'save': {
        const v = body._cur;
        if (!v.name) { alert('Vessel Name を入力してください'); return; }
        delete v.seed;
        v.cats = v.cats.map(c => ({ ...c, name: (c.name || '').trim() }));
        if (v.cats.some(c => !c.name)) { alert('名称が空の大カテゴリがあります'); return; }
        v.cats.forEach(c => { if (!c.code) c.code = catCode(c.name); });
        const dupC = v.cats.find((c, i) => v.cats.findIndex(x => x.name === c.name) !== i);
        if (dupC) { alert(`大カテゴリ「${dupC.name}」が重複しています`); return; }
        v.locations = v.locations.map(l => ({ ...l, name: l.name.trim() })).filter(l => l.name);
        const dup = v.locations.find((l, i) => v.locations.findIndex(x => x.cat === l.cat && x.name === l.name) !== i);
        if (dup) { alert(`「${dup.name}」が重複しています`); return; }
        v.updatedAt = Date.now();
        await Store.putVessel(v);
        const i = S.vessels.findIndex(x => x.id === v.id);
        if (i >= 0) S.vessels[i] = v; else S.vessels.push(v);
        for (const vi of S.visits.filter(x => x.vesselId === v.id && x.vesselName !== v.name)) { vi.vesselName = v.name; await Store.putVisit(vi); }
        let eqMsg = '';
        if (!v.eqShip) {
          const sh = findEqShip(v.name);
          if (sh) { const r = await importEqMaster(v, sh, await Store.listEquip(v.id)); eqMsg = `（機器搭載リストから ${r.added}件を登録）`; }
        }
        if (S.vessel && S.vessel.id === v.id) S.equip = await Store.listEquip(v.id);
        if (S.visit) { setVesselContext(); render(); }
        body.oninput = body.onchange = null; listView(); toast(`${v.name} を保存しました${eqMsg}`);
        break;
      }
      case 'del': {
        const v = body._cur;
        if (S.visits.some(x => x.vesselId === v.id)) { alert('この船の訪船記録があるため削除できません。先に訪船を削除してください。'); return; }
        if (!confirm(`${v.name} を削除しますか？`)) return;
        await Store.deleteVessel(v.id);
        S.vessels = S.vessels.filter(x => x.id !== v.id);
        body.oninput = body.onchange = null; listView();
        break;
      }
    }
  });
  listView();
}

/* ================= 一括振り分け ================= */
function openAssign(ids) {
  if (!ids.length) return;
  let loc = null;
  const dlg = openModal({
    title: `${ids.length}枚を振り分け`, wide: true,
    body: `<div class="asg"><div><h4>場所</h4>${locPickerHTML()}</div><div><h4>項目（複数選択可）</h4><div class="ichips">${itemChips([])}</div>
      <p><label class="chk"><input type="checkbox" id="asAdd">同じ場所の写真は、既存の項目に追加する（オフ：置き換え）</label></p></div></div>`,
    footer: `<span class="hint" id="asSel">場所を選んでください</span><span class="sp"></span><button data-act="close">キャンセル</button><button class="primary" data-m="apply" disabled>振り分ける</button>`
  });
  const lp = mountLocPicker(dlg.querySelector('.lp'), null, id => {
    loc = id;
    dlg.querySelector('#asSel').textContent = `場所：${S.locMap.get(id).name}`;
    dlg.querySelector('[data-m="apply"]').disabled = false;
  });
  if (!isMobile()) lp.focus();
  dlg.addEventListener('click', async e => {
    if (!e.target.closest('[data-m="apply"]') || !loc) return;
    const items = readChips(dlg), add = dlg.querySelector('#asAdd').checked;
    for (const id of ids) {
      const ph = S.photos.find(x => x.id === id); if (!ph) continue;
      if (add && ph.loc === loc) ph.items = [...new Set([...ph.items, ...items])];
      else { ph.loc = loc; ph.items = items; }
      await Store.putPhoto(ph);
    }
    S.selected.clear();
    closeModal();
    if (S.catTab !== 'ALL') S.catTab = S.locMap.get(loc).cat;
    if (isMobile() && unassigned().length) S.tab = 'tray';
    render();
    toast(`${ids.length}枚を ${S.locMap.get(loc).name} に振り分けました`);
  });
}

function openPhotoList({ title, getList, itemId = null, reopen, showLoc = false, showItems = false }) {
  const arr = getList();
  if (!arr.length) { toast('写真はありません'); return; }
  const nums = photoNumbers();
  const sel = new Set();
  const dlg = openModal({
    title: `${title}（${arr.length}枚）`, wide: true,
    body: `<div class="cgrid">${arr.map(ph => `<div class="ci ${ph.excel ? 'xl' : ''}"><button class="cthumb" data-m="open" data-id="${ph.id}" aria-label="${esc(nums.get(ph.id))}を開く"><img data-thumb="${ph.id}" alt="">${ph.excel ? '<i class="xlmark">Excel</i>' : ''}</button><label><input type="checkbox" data-id="${ph.id}">${esc(nums.get(ph.id)?.split('-').pop())}　${fmtTime(ph.takenAt)}${needsComment(ph) ? '<span class="tag fl">未コメント</span>' : ''}${ph.edit?.shapes?.length ? '<span class="tag">書き込み</span>' : ''}${ph.major ? '<span class="tag ex">Major</span>' : ''}${ph.size === 'detail' ? '<span class="tag">Detail</span>' : ''}</label>${showLoc ? `<div class="hint">${esc(S.locMap.get(ph.loc)?.name || '')}</div>` : ''}${showItems ? `<div class="citems">${ph.items.length ? ph.items.map(i => `<span class="tag">${esc(itemName(i))}</span>`).join('') : '<span class="hint">項目なし</span>'}</div>` : ''}${eqById(ph.equipId) ? `<div class="hint">${esc(eqLabel(eqById(ph.equipId)))}</div>` : ''}</div>`).join('')}</div>`,
    footer: `<button data-m="selall" data-keep="1">全選択</button><span class="hint" id="cSel">写真を選ぶと操作できます</span><span class="sp"></span><button class="xlbtn" data-m="xlon" disabled>Excelに使う</button><button data-m="xloff" disabled>Excelに使わない</button>${itemId ? '<button data-m="unitem" disabled>この項目から外す</button>' : ''}<button data-m="back" disabled>未振り分けに戻す</button><button class="primary" data-m="move" disabled>別の場所へ移動</button>`
  });
  hydrate(dlg);
  const upd = () => {
    dlg.querySelector('#cSel').textContent = sel.size ? `${sel.size}枚選択中` : '写真を選ぶと操作できます';
    dlg.querySelectorAll('footer button[data-m]:not([data-keep])').forEach(b => b.disabled = !sel.size);
    dlg.querySelector('[data-m="selall"]').textContent = sel.size === arr.length ? '選択解除' : '全選択';
  };
  dlg.addEventListener('change', e => { const id = e.target.dataset.id; if (id) { e.target.checked ? sel.add(id) : sel.delete(id); upd(); } });
  dlg.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;

    if (m === 'open') {
      closeModal();
      openViewer(arr.map(x => x.id), b.dataset.id, () => { if (getList().length) reopen(); });
      return;
    }
    if (m === 'selall') {
      const all = sel.size !== arr.length;
      dlg.querySelectorAll('.ci input[data-id]').forEach(cb => { cb.checked = all; all ? sel.add(cb.dataset.id) : sel.delete(cb.dataset.id); });
      upd(); return;
    }
    const phs = [...sel].map(id => S.photos.find(x => x.id === id)).filter(Boolean);
    if (m === 'xlon' || m === 'xloff') {
      const on = m === 'xlon';
      for (const ph of phs) if (!!ph.excel !== on) { ph.excel = on; await Store.putPhoto(ph); }
      closeModal(); render(); reopen();
      toast(`${phs.length}枚を「Excelに${on ? '使う' : '使わない'}」にしました`);
      return;
    }
    if (m === 'back') { for (const ph of phs) { ph.loc = null; ph.items = []; await Store.putPhoto(ph); } closeModal(); render(); toast(`${phs.length}枚を未振り分けに戻しました`); }
    else if (m === 'unitem') { for (const ph of phs) { ph.items = ph.items.filter(x => x !== itemId); await Store.putPhoto(ph); } closeModal(); render(); toast(`${phs.length}枚から ${itemName(itemId)} を外しました`); }
    else if (m === 'move') { closeModal(); openAssign([...sel]); }
  });
}

/* ================= 写真ビューア ================= */
function openViewer(ids, startId, back, opts = {}) {
  const queue = !!opts.queue;

      <div class="field"><span>Equipment</span><div class="eqc"><input id="pvEqQ" type="search" placeholder="機器名・メーカー・型式で検索" autocomplete="off" enterkeyhint="done"><button data-m="eqclear" aria-label="機器を外す">✕</button><button data-m="eqnew">新規</button><div class="eqlist" id="pvEqList" hidden></div></div>
        <div class="inlp" id="pvEqNew" hidden><div class="grid2"><label class="field"><span>Equipment Name</span><input id="qeName"></label><label class="field"><span>Equipment No.</span><input id="qeNo"></label><label class="field"><span>Maker</span><input id="qeMaker"></label><label class="field"><span>Model</span><input id="qeModel"></label></div>
        <p class="hint" style="margin:0 0 6px">場所はこの写真の場所で登録されます。詳細は「メニュー → Equipment 管理」で編集できます。</p><p style="display:flex;gap:6px;margin:0"><span class="sp"></span><button data-m="eqcancel">キャンセル</button><button class="primary" data-m="eqsave">登録</button></p></div></div>
      <label class="field"><span>コメント</span><textarea id="pvCom" rows="4" placeholder="指摘内容、対応予定など"></textarea></label>

      <p style="display:flex;gap:16px;flex-wrap:wrap"><label class="chk xlchk"><input type="checkbox" id="pvExcel">Excel出力に使う</label><label class="chk"><input type="checkbox" id="pvMajor">Major Finding</label></p>

  });
  const com = dlg.querySelector('#pvCom');

  function markDirty() { dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 500); }
  async function flush() { clearTimeout(saveT); if (!dirty || !ph) return; dirty = false; await Store.putPhoto(ph); }
  function paint() {
    if (!img || !ph) return;
    const st = dlg.querySelector('#pvStage'), dpr = window.devicePixelRatio || 1;

    c.id = 'pvCan'; c.style.width = (c.width / dpr) + 'px'; c.style.height = (c.height / dpr) + 'px';

    dlg.querySelector('#pvItems').innerHTML = itemChips(ph.items);
    dlg.querySelector('#pvFlags').innerHTML = flagTags(ph);
    eqq.value = eqText();
    eql.hidden = true;
  }
  async function load() {
    await flush();
    const my = ++token;
    ph = S.photos.find(x => x.id === ids[idx]);
    if (!ph) { closeModal(); return; }
    ph.edit ||= newEdit(); ph.items ||= [];
    dlg.querySelector('header h3').textContent = queue ? `まとめて入力（${idx + 1} / ${ids.length}）` : `写真 ${idx + 1} / ${ids.length}`;
    dlg.querySelector('#pvMeta').textContent = `${ph.name}　撮影 ${fmtFull(ph.takenAt)}　${(PHOTO_SIZES[ph.size] || PHOTO_SIZES.std).label}${ph.width ? `（${ph.width}×${ph.height}）` : ''}${ph.createdBy ? `　撮影者 ${ph.createdBy.split('@')[0]}` : ''}`;
    com.value = ph.comment || '';
    dlg.querySelector('#pvComEn').value = ph.commentEn || '';
    dlg.querySelector('#pvEnBox').open = !!ph.commentEn;
    dlg.querySelector('#pvMajor').checked = !!ph.major;
    dlg.querySelector('#pvExcel').checked = !!ph.excel;
    dlg.querySelector('#pvEqNew').hidden = true;
    dlg.querySelector('[data-m="prev"]').disabled = idx === 0;

    dlg.querySelector('#pvPos').textContent = `${idx + 1} / ${ids.length}`;
    lpBox.hidden = !(queue && !isAssigned(ph));
    if (!lpBox.hidden) lp.set(ph.loc);
    fill();
    const url = await fullURL(ph.id);
    if (my !== token) return;
    if (!url) { toast('写真を読み込めません（通信を確認してください）'); return; }
    const im = await loadImg(url);
    if (my !== token) return;
    img = im; paint();
  }
  function go(d) { const n = idx + d; if (n < 0 || n >= ids.length) return; idx = n; load(); }

  com.addEventListener('input', () => { ph.comment = com.value; markDirty(); dlg.querySelector('#pvFlags').innerHTML = flagTags(ph); });
  dlg.querySelector('#pvMajor').addEventListener('change', e => { ph.major = e.target.checked; markDirty(); });
  dlg.querySelector('#pvExcel').addEventListener('change', e => { ph.excel = e.target.checked; markDirty(); });
  dlg.querySelector('#pvComEn').addEventListener('input', e => { ph.commentEn = e.target.value; markDirty(); });
  const eqq = dlg.querySelector('#pvEqQ'), eql = dlg.querySelector('#pvEqList');
  function eqText() { const e = ph && eqById(ph.equipId); return e ? eqLabel(e) : ''; }
  async function setEq(id) {
    ph.equipId = id || null; markDirty();
    const eq = eqById(ph.equipId);
    if (eq && !eq.locId && isAssigned(ph)) { eq.locId = ph.loc; await Store.putEquip(eq); }
  }
  function eqMatches(q) {
    const toks = String(q).split(/\s+/).map(norm).filter(Boolean);
    const here = e => (e.locId && e.locId === ph.loc) ? 1 : 0;
    const arr = S.equip.filter(e => { if (!toks.length) return true; const h = norm(`${e.name} ${e.eqNo} ${e.maker} ${e.model} ${e.system}`); return toks.every(t => h.includes(t)); });
    const head = e => toks.length && norm(e.name).startsWith(toks[0]) ? 1 : 0;
    return arr.sort((a, b) => here(b) - here(a) || head(b) - head(a) || sysOrder(a.system) - sysOrder(b.system) || (a.ord || 0) - (b.ord || 0));
  }
  function drawEqList() {
    const q = eqq.value === eqText() ? '' : eqq.value, arr = eqMatches(q), LIM = 80;
    let h = '', last = null;
    for (const e of arr.slice(0, LIM)) {
      const g = (e.locId && e.locId === ph.loc) ? 'この場所の機器' : (e.system || 'その他');
      if (g !== last) { h += `<div class="lpg">${esc(g)}</div>`; last = g; }
      h += `<button type="button" class="lpi ${e.id === ph.equipId ? 'on' : ''}" data-eq="${e.id}"><span>${esc(e.name)}</span><small>${esc([e.maker, e.model].filter(Boolean).join(' '))}</small></button>`;
    }
    if (arr.length > LIM) h += `<p class="hint" style="padding:6px 10px;margin:0">ほか ${arr.length - LIM}件。文字を追加して絞り込んでください。</p>`;
    eql.innerHTML = h || '<p class="empty" style="padding:10px;margin:0">該当する機器がありません。「新規」で登録できます。</p>';
    eql.hidden = false;
  }
  eqq.addEventListener('focus', () => { eqq.select(); drawEqList(); });
  eqq.addEventListener('input', drawEqList);
  eqq.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); eql.querySelector('[data-eq]')?.click(); }
    if (e.key === 'Escape') { e.stopPropagation(); eql.hidden = true; eqq.value = eqText(); eqq.blur(); }
  });
  eqq.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== eqq) { eql.hidden = true; eqq.value = eqText(); } }, 250));
  eql.addEventListener('pointerdown', e => e.preventDefault());
  eql.addEventListener('mousedown', e => e.preventDefault());
  eql.addEventListener('click', async e => {
    const b = e.target.closest('[data-eq]'); if (!b) return;
    await setEq(b.dataset.eq);
    eql.hidden = true; eqq.value = eqText(); eqq.blur();
  });
  dlg.querySelector('#pvItems').addEventListener('click', e => {
    const b = e.target.closest('.ich'); if (!b) return;
    setTimeout(() => { ph.items = readChips(dlg.querySelector('#pvItems')); markDirty(); });
  });
  dlg.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    switch (b.dataset.m) {
      case 'prev': go(-1); break;
      case 'next': if (idx >= ids.length - 1) closeModal(); else go(1); break;
      case 'loc': lpBox.hidden = !lpBox.hidden; if (!lpBox.hidden) { lp.set(ph.loc); if (!isMobile()) lp.focus(); } break;
      case 'lpclose': lpBox.hidden = true; break;
      case 'unloc': ph.loc = null; ph.items = []; lpBox.hidden = true; markDirty(); fill(); break;
      case 'edit':
        if (!img) return;
        openPhotoEditor(img, ph.edit, async ed => { ph.edit = ed; paint(); dirty = true; await flush(); await refreshThumb(ph, img); });
        break;
      case 'eqclear': await setEq(null); eqq.value = ''; eql.hidden = true; break;
      case 'eqnew': {
        const box = dlg.querySelector('#pvEqNew');
        box.hidden = !box.hidden;
        if (!box.hidden) { box.querySelectorAll('input').forEach(i => i.value = ''); box.querySelector('#qeName').focus(); }
        break;
      }
      case 'eqcancel': dlg.querySelector('#pvEqNew').hidden = true; break;
      case 'eqsave': {
        const name = dlg.querySelector('#qeName').value.trim();
        if (!name) { alert('Equipment Name を入力してください'); return; }
        const eq = newEquip(S.vessel.id, ph.loc);
        Object.assign(eq, { name, eqNo: dlg.querySelector('#qeNo').value.trim(), maker: dlg.querySelector('#qeMaker').value.trim(), model: dlg.querySelector('#qeModel').value.trim() });
        await Store.putEquip(eq); S.equip.push(eq);
        ph.equipId = eq.id; markDirty(); fill();
        dlg.querySelector('#pvEqNew').hidden = true;
        toast(`${name} を登録しました`);
        break;
      }
      case 'history': await flush(); openCompare(ph); break;
      case 'delete': {
        if (!confirm('この写真（元写真を含む）を削除します。元に戻せません。削除しますか？')) return;
        const id = ph.id;
        dirty = false; ph = null;
        await Store.deletePhoto(id);
        S.photos = S.photos.filter(x => x.id !== id);
        S.selected.delete(id); dropCache(id);
        ids.splice(idx, 1);
        toast('写真を削除しました');
        if (!ids.length) { closeModal(); return; }
        idx = Math.min(idx, ids.length - 1);
        load();
        break;
      }
    }
  });
  load();
}

/* ================= 写真編集 ================= */
function openPhotoEditor(img, edit0, onDone) {
  const [W, H] = dimsOf(img);
  let edit = clone(edit0 || newEdit());
  const undo = [], redo = [];
  let tool = 'pen', color = COLORS[0][0], mode = 'draw', showOrig = false, drag = null, crop = null, cropDrag = null, view = null;
  const pe = $('#pe');
  const TOOLS = [['pen', 'ペン'], ['arrow', '矢印'], ['circle', '丸'], ['rect', '四角'], ['text', '文字'], ['dim', '寸法']];
  pe.innerHTML = `<div class="pebar"><button data-e="cancel">キャンセル</button><b id="peTitle">書き込み・編集</b><button class="primary" data-e="done">完了</button></div>
    <div class="pestage" id="peStage"><canvas id="peBase"></canvas><canvas id="peOv"></canvas></div>
    <div class="petools" id="peDraw">
      <div class="perow">${TOOLS.map(([k, n]) => `<button data-e="tool" data-v="${k}" class="${k === tool ? 'on' : ''}">${n}</button>`).join('')}<span class="sep"></span>${COLORS.map(([c, n], i) => `<button class="sw ${i ? '' : 'on'}" data-e="color" data-v="${c}" style="background:${c}" aria-label="${n}"></button>`).join('')}</div>
      <div class="perow"><button data-e="undo">元に戻す</button><button data-e="redo">やり直す</button><button data-e="clear">全削除</button><span class="sep"></span><button data-e="orig" id="peOrig">元写真</button><button data-e="rot">回転</button><button data-e="crop">トリミング</button><span class="sep"></span><label>明るさ<input type="range" id="peBright" min="0.5" max="1.8" step="0.05"></label></div>
    </div>
    <div class="petools" id="peCrop" hidden><div class="perow"><span class="hint" style="color:#C9D3DC">枠の中をドラッグで移動、外側をドラッグで範囲を指定</span></div>
      <div class="perow"><button data-e="cropReset">トリミング解除</button><span class="sp"></span><button data-e="cropCancel">キャンセル</button><button class="on" data-e="cropApply">適用</button></div></div>`;
  pe.hidden = false;
  const stage = pe.querySelector('#peStage'), base = pe.querySelector('#peBase'), ov = pe.querySelector('#peOv');
  const bctx = base.getContext('2d'), octx = ov.getContext('2d'), bright = pe.querySelector('#peBright');
  bright.value = edit.bright;

  const snap = () => { undo.push(JSON.stringify(edit)); redo.length = 0; };
  const rdims = () => (edit.rot % 180 ? [H, W] : [W, H]);

  function layout() {
    const [rw0, rh0] = rdims();
    const rw = showOrig ? W : rw0, rh = showOrig ? H : rh0;
    const R = (mode === 'crop' || showOrig || !edit.crop) ? { x: 0, y: 0, w: 1, h: 1 } : edit.crop;
    const cw = Math.max(50, stage.clientWidth - 16), ch = Math.max(50, stage.clientHeight - 16);
    const s = Math.min(cw / (R.w * rw), ch / (R.h * rh));
    const w = R.w * rw * s, h = R.h * rh * s, dpr = window.devicePixelRatio || 1;
    for (const c of [base, ov]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + 'px'; c.style.height = h + 'px'; }
    view = { s, R, rw, rh, dpr };
    drawBase(); drawOv();
  }
  const setT = ctx => { const { s, R, rw, rh, dpr } = view; ctx.setTransform(dpr * s, 0, 0, dpr * s, -R.x * rw * s * dpr, -R.y * rh * s * dpr); };
  const clearC = (ctx, c) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); };
  function drawBase() {
    clearC(bctx, base); setT(bctx);
    drawRotated(bctx, img, showOrig ? 0 : edit.rot, W, H);
    base.style.filter = showOrig || edit.bright === 1 ? '' : `brightness(${edit.bright})`;
  }
  function drawOv() {
    clearC(octx, ov);
    if (showOrig) return;
    setT(octx);
    const { rw, rh, s } = view;
    for (const sh of edit.shapes) drawShape(octx, sh, rw, rh);
    if (mode === 'crop' && crop) {
      const x = crop.x * rw, y = crop.y * rh, w = crop.w * rw, h = crop.h * rh;
      octx.save();
      octx.fillStyle = 'rgba(0,0,0,.55)';
      octx.beginPath(); octx.rect(0, 0, rw, rh); octx.rect(x, y, w, h); octx.fill('evenodd');
      octx.strokeStyle = '#F0B400'; octx.lineWidth = 3 / s; octx.strokeRect(x, y, w, h);
      octx.lineWidth = 1 / s; octx.strokeStyle = 'rgba(255,255,255,.6)';
      for (const k of [1, 2]) {
        octx.beginPath(); octx.moveTo(x + w * k / 3, y); octx.lineTo(x + w * k / 3, y + h); octx.stroke();
        octx.beginPath(); octx.moveTo(x, y + h * k / 3); octx.lineTo(x + w, y + h * k / 3); octx.stroke();
      }
      octx.restore();
    }
  }
  const pt = e => {
    const r = ov.getBoundingClientRect(), { s, R, rw, rh } = view;
    const x = ((e.clientX - r.left) / s + R.x * rw) / rw, y = ((e.clientY - r.top) / s + R.y * rh) / rh;
    return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
  };
  const LW = 0.005;
  const tiny = (a, b) => Math.hypot((a[0] - b[0]) * view.rw, (a[1] - b[1]) * view.rh) * view.s < 6;

  ov.addEventListener('pointerdown', e => {
    if (showOrig) return;
    e.preventDefault();
    ov.setPointerCapture(e.pointerId);
    const p = pt(e);
    if (mode === 'crop') {
      const inside = crop && p[0] > crop.x && p[0] < crop.x + crop.w && p[1] > crop.y && p[1] < crop.y + crop.h;
      cropDrag = inside ? { move: true, start: p, orig: { ...crop } } : { move: false, start: p };
      return;
    }
    if (tool === 'text') {
      const t = prompt('書き込む文字');
      if (t && t.trim()) { snap(); edit.shapes.push({ t: 'text', a: p, text: t.trim(), c: color, size: 0.04 }); drawOv(); }
      return;
    }
    snap();
    drag = tool === 'pen' ? { t: 'pen', pts: [p], c: color, w: LW } : { t: tool, a: p, b: p, c: color, w: LW };
    edit.shapes.push(drag);
    drawOv();
  });
  ov.addEventListener('pointermove', e => {
    if (cropDrag) {
      const p = pt(e);
      if (cropDrag.move) {
        const o = cropDrag.orig;
        crop.x = Math.min(1 - o.w, Math.max(0, o.x + p[0] - cropDrag.start[0]));
        crop.y = Math.min(1 - o.h, Math.max(0, o.y + p[1] - cropDrag.start[1]));
      } else {
        const a = cropDrag.start;
        crop = { x: Math.min(a[0], p[0]), y: Math.min(a[1], p[1]), w: Math.abs(p[0] - a[0]), h: Math.abs(p[1] - a[1]) };
      }
      drawOv(); return;
    }
    if (!drag) return;
    const p = pt(e);
    if (drag.t === 'pen') drag.pts.push(p); else drag.b = p;
    drawOv();
  });
  const up = () => {
    if (cropDrag) { cropDrag = null; if (crop && (crop.w < 0.03 || crop.h < 0.03)) crop = null; drawOv(); return; }
    if (!drag) return;
    const d = drag; drag = null;
    const cancel = () => { edit.shapes.pop(); undo.pop(); drawOv(); };
    if (d.t !== 'pen' && tiny(d.a, d.b)) { cancel(); return; }
    if (d.t === 'dim') {
      const t = prompt('寸法を入力（例: 150 mm）', '');
      if (t === null) { cancel(); return; }
      d.text = t.trim();
    }
    drawOv();
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);

  bright.addEventListener('pointerdown', snap);
  bright.addEventListener('keydown', snap);
  bright.addEventListener('input', () => { edit.bright = +bright.value; drawBase(); });

  function setMode(m) {
    mode = m;
    pe.querySelector('#peDraw').hidden = m === 'crop';
    pe.querySelector('#peCrop').hidden = m !== 'crop';
    pe.querySelector('#peTitle').textContent = m === 'crop' ? 'トリミング' : '書き込み・編集';
    layout();
  }
  function rotateEdit() {
    const r = ([x, y]) => [1 - y, x];
    for (const s of edit.shapes) {
      if (s.pts) s.pts = s.pts.map(r);
      if (s.a) s.a = r(s.a);
      if (s.b) s.b = r(s.b);
    }
    if (edit.crop) { const c = edit.crop; edit.crop = { x: 1 - (c.y + c.h), y: c.x, w: c.h, h: c.w }; }
    edit.rot = (edit.rot + 90) % 360;
  }
  function close() {
    window.removeEventListener('resize', layout);
    document.removeEventListener('keydown', onKey, true);
    pe.hidden = true; pe.innerHTML = '';
  }
  function onKey(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); pe.querySelector(e.shiftKey ? '[data-e="redo"]' : '[data-e="undo"]').click(); }
    if (e.key === 'Escape') { e.stopImmediatePropagation(); pe.querySelector(mode === 'crop' ? '[data-e="cropCancel"]' : '[data-e="cancel"]').click(); }
  }
  window.addEventListener('resize', layout);
  document.addEventListener('keydown', onKey, true);

  pe.onclick = e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    switch (b.dataset.e) {
      case 'tool': tool = b.dataset.v; pe.querySelectorAll('[data-e="tool"]').forEach(x => x.classList.toggle('on', x === b)); break;
      case 'color': color = b.dataset.v; pe.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); break;
      case 'undo': if (undo.length) { redo.push(JSON.stringify(edit)); edit = JSON.parse(undo.pop()); bright.value = edit.bright; layout(); } break;
      case 'redo': if (redo.length) { undo.push(JSON.stringify(edit)); edit = JSON.parse(redo.pop()); bright.value = edit.bright; layout(); } break;
      case 'clear': if (edit.shapes.length && confirm('書き込みをすべて消しますか？')) { snap(); edit.shapes = []; drawOv(); } break;
      case 'orig': showOrig = !showOrig; b.classList.toggle('on', showOrig); b.textContent = showOrig ? '編集後に戻る' : '元写真'; layout(); break;
      case 'rot': if (showOrig) return; snap(); rotateEdit(); layout(); break;
      case 'crop': if (showOrig) return; crop = edit.crop ? { ...edit.crop } : { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }; setMode('crop'); break;
      case 'cropCancel': crop = null; setMode('draw'); break;
      case 'cropReset': if (edit.crop) { snap(); edit.crop = null; } crop = null; setMode('draw'); break;
      case 'cropApply': if (crop) { snap(); edit.crop = { ...crop }; } crop = null; setMode('draw'); break;
      case 'cancel':
        if (undo.length && !confirm('編集内容を破棄しますか？')) return;
        close(); break;
      case 'done': close(); onDone(edit); break;
    }
  };
  requestAnimationFrame(layout);
}

function camReason(e) {
  const inFrame = (() => { try { return window.top !== window.self; } catch (x) { return true; } })();
  if (!window.isSecureContext) return '理由：https ではないページのため';
  if (!navigator.mediaDevices?.getUserMedia) return '理由：このブラウザ（画面）ではカメラ機能が提供されていません' + (inFrame ? '（埋め込み表示）' : '');
  const n = e?.name || '';
  if (n === 'NotAllowedError') return inFrame ? '理由：埋め込み表示のためカメラが許可されていません（NotAllowedError）' : '理由：カメラへのアクセスが拒否されています。設定 → Safari → カメラ を「確認」または「許可」にしてください（NotAllowedError）';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return `理由：使用できるカメラが見つかりません（${n}）`;
  if (n === 'NotReadableError') return '理由：他のアプリがカメラを使用中です（NotReadableError）';
  return `理由：${n || e?.message || '不明'}`;
}
async function startStream() {

    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera api');
    try { Cam.stream = await tryGet({ facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } }); }
    catch (e) { if (e?.name === 'OverconstrainedError') Cam.stream = await tryGet({ facingMode: 'environment' }); else throw e; }
    Cam.track = Cam.stream.getVideoTracks()[0];
    const v = $('#camVideo');
    v.setAttribute('playsinline', ''); v.muted = true;
    v.srcObject = Cam.stream;
    v.onloadedmetadata = v.onresize = () => camGuide();
    try { await v.play(); } catch (e) { /* 自動再生はタップ後に再開 */ }
  } catch (e) {

/* 撮影画面に 4:3（縦持ちは 3:4）の保存範囲を表示 */
function camGuide() {
  const v = $('#camVideo'), g = $('#camGuide');
  if (!v || !g) return;
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh || Cam.fallback || $('#cam').hidden) { g.hidden = true; return; }
  const bw = v.clientWidth, bh = v.clientHeight;
  const k = Math.min(bw / vw, bh / vh), dw = vw * k, dh = vh * k;
  const r = vw >= vh ? 4 / 3 : 3 / 4;
  let gw = dw, gh = dh;
  if (dw / dh > r) gw = dh * r; else gh = dw / r;
  Object.assign(g.style, { width: gw + 'px', height: gh + 'px', left: (bw - gw) / 2 + 'px', top: (bh - gh) / 2 + 'px' });
  g.hidden = false;
}

async function importFiles(fileList) {

  const files = [...fileList].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif)$/i.test(f.name));
  if (!files.length) return;
  const vid = S.visit.id, prog = $('#progress');

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    $('#pText').textContent = `取り込み中 ${i + 1} / ${files.length}枚`;
    $('#pBar').style.width = `${(i / files.length) * 100}%`;
    try {
      const takenAt = (await readExifDate(f)) ?? f.lastModified;
      if (S.photos.some(x => x.name === f.name && x.takenAt === takenAt)) { skipped++; continue; }
      await storePhoto(vid, f, { name: f.name, takenAt });
      added++;
    } catch (e) { failed.push(f.name); }
  }
  prog.hidden = true;
  S.tab = 'tray';
  render();
  let msg = `${added}枚を取り込みました`;
  if (skipped) msg += `（取り込み済みの${skipped}枚は省略）`;
  if (failed.length) msg += `。${failed.length}枚は読み込めませんでした（ブラウザ非対応の形式の可能性があります）`;
  toast(msg);
}

async function importEqMaster(vessel, shipName, list) {
  const m = eqMaster(), rows = m.ships[shipName] || [];
  const byId = new Map(list.map(e => [e.id, e])), seen = {};
  let added = 0, updated = 0;
  for (let k = 0; k < rows.length; k++) {
    const [ci, name, mk, typ, qty, det] = rows[k], sys = m.cats[ci] || '';
    const base = slug(`${sys}-${name}`) || 'eq';
    seen[base] = (seen[base] || 0) + 1;
    const id = `X-${vessel.id}-${base}-${seen[base]}`;
    let e = byId.get(id);
    if (e) updated++; else { e = newEquip(vessel.id, null); e.id = id; list.push(e); byId.set(id, e); added++; }
    Object.assign(e, { name, system: sys, maker: m.makers[mk] || '', model: typ, qty, details: det, src: shipName, ord: k });
    await Store.putEquip(e);

  vessel.eqShip = shipName; vessel.eqImportedAt = Date.now();

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

}

    if (!locCache.has(visit.id)) { const vs = S.vessels.find(x => x.id === visit.vesselId); locCache.set(visit.id, new Map((visit.locations || vesselLocs(vs)).map(l => [l.id, l]))); }
    return locCache.get(visit.id).get(locId);
  };
