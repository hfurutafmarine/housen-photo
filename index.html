  dlg.querySelector('#eqQ').addEventListener('input', () => { if (!body._e) draw(); });
  dlg.querySelector('#eqCsv').addEventListener('change', async ev => {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    const rows = parseCSV(await f.text());
    if (rows.length < 2) { alert('CSVにデータがありません'); return; }
    const head = rows[0].map(h => h.trim().toLowerCase());
    const col = keys => head.findIndex(h => keys.includes(h));
    const locCol = col(['location', '場所']);
    const map = EQ_FIELDS.map(([k, , keys]) => [k, col(keys)]);
    if (map.find(([k]) => k === 'name')[1] < 0) { alert('「Equipment Name」列が見つかりません'); return; }
    let added = 0, updated = 0, noLoc = 0;
    for (const r of rows.slice(1)) {
      const get = i => i >= 0 ? (r[i] || '').trim() : '';
      const name = get(map.find(([k]) => k === 'name')[1]);
      if (!name) continue;
      const eqNo = get(map.find(([k]) => k === 'eqNo')[1]);
      let e = eqNo ? list.find(x => x.eqNo === eqNo) : null;
      if (e) updated++; else { e = newEquip(vessel.id, null); list.push(e); added++; }
      for (const [k, i] of map) if (i >= 0 && get(i)) e[k] = get(i);
      const ln = get(locCol);
      if (ln) { const hit = locs.find(l => norm(l.name) === norm(ln)) || searchLocs(locs, ln)[0]; e.locId = hit ? hit.id : e.locId; if (!hit) noLoc++; }
      else if (!e.locId) noLoc++;
      e.updatedAt = Date.now();
      await Store.putEquip(e);
    }
    syncState(); draw();
    toast(`追加 ${added}件・更新 ${updated}件${noLoc ? `（場所が特定できない ${noLoc}件は場所未設定）` : ''}`);
  });
  dlg.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-m]'); if (!b || !body.contains(b) && !['add', 'export'].includes(b.dataset.m)) return;
    switch (b.dataset.m) {
      case 'add': form(newEquip(vessel.id, null)); break;
      case 'edit': form(clone(list.find(x => x.id === b.dataset.id))); break;
      case 'back': body._e = null; draw(); break;
      case 'save': {
        const e = body._e;
        body.querySelectorAll('[data-k]').forEach(i => { e[i.dataset.k] = i.value.trim(); });
        if (!e.name) { alert('Equipment Name を入力してください'); return; }
        e.updatedAt = Date.now();
        await Store.putEquip(e);
        const i = list.findIndex(x => x.id === e.id);
        if (i >= 0) list[i] = e; else list.push(e);
        syncState(); body._e = null; draw(); toast(`${e.name} を保存しました`);
        break;
      }
      case 'del': {
        const e = body._e;
        if (!confirm(`${e.name} を削除しますか？（写真との紐付けは解除されます）`)) return;
        await Store.deleteEquip(e.id);
        list = list.filter(x => x.id !== e.id);
        syncState(); body._e = null; draw();
        break;
      }
      case 'export': {
        const head = ['Category', 'Location', ...EQ_FIELDS.map(f => f[1])];
        const lines = [head.join(',')].concat(list.map(e => { const l = locMap.get(e.locId); return [l ? catName(l.cat) : '', l ? l.name : '', ...EQ_FIELDS.map(([k]) => e[k])].map(csvCell).join(','); }));
        download(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv' }), `${safeName(vessel.name)}_equipment.csv`);
        break;
      }
    }
  });
  load();
}

async function openSearch() {
  const [photos, equips] = await Promise.all([Store.allPhotos(), Store.allEquip()]);
  const visitMap = new Map(S.visits.map(v => [v.id, v]));
  const eqMap = new Map(equips.map(e => [e.id, e]));
  const locCache = new Map();
  const locOf = (vesselId, locId) => {
    if (!locCache.has(vesselId)) { const v = S.vessels.find(x => x.id === vesselId); locCache.set(vesselId, new Map(v ? buildLocations(v).map(l => [l.id, l]) : [])); }
    return locCache.get(vesselId).get(locId);
  };
  const ports = [...new Set(S.visits.map(v => v.port).filter(Boolean))];
  const dlg = openModal({
    title: '検索', wide: true,
    body: `<div class="grid3">
      <label class="field"><span>Vessel</span><select id="sV"><option value="">すべて</option>${S.vessels.map(v => `<option value="${v.id}" ${S.vessel?.id === v.id ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Port</span><input id="sPort" list="sPortList"><datalist id="sPortList">${ports.map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>

      <label class="field"><span>Visit Date（から）</span><input id="sFrom" type="date"></label>
      <label class="field"><span>Visit Date（まで）</span><input id="sTo" type="date"></label>
      <label class="field"><span>場所・コメント</span><input id="sKw" placeholder="例: me, 錆"></label></div>
      <p style="display:flex;gap:16px;flex-wrap:wrap;margin:0"><label class="chk"><input type="checkbox" id="sMajor">Major Finding のみ</label><span class="hint" id="sCount"></span></p>
      <div class="sres" id="sRes"></div>`,
    footer: '<span class="sp"></span><button data-act="close">閉じる</button>'
  });
  const run = () => {
    const g = id => dlg.querySelector(id).value.trim();
    const vId = g('#sV'), port = norm(g('#sPort')), eqq = norm(g('#sEq')), kw = norm(g('#sKw')), from = g('#sFrom'), to = g('#sTo'), major = dlg.querySelector('#sMajor').checked;
    const res = photos.filter(p => {
      const v = visitMap.get(p.visitId); if (!v) return false;
      if (vId && v.vesselId !== vId) return false;
      if (port && !norm(v.port || '').includes(port)) return false;
      if (from && v.date < from) return false;
      if (to && v.date > to) return false;
      if (major && !p.major) return false;
      if (eqq) { const e = eqMap.get(p.equipId); if (!e || !norm(`${e.name} ${e.eqNo}`).includes(eqq)) return false; }
      if (kw) {
        const l = locOf(v.vesselId, p.loc);
        const hay = `${l?.name || ''} ${(l?.aliases || []).join(' ')} ${p.comment || ''} ${p.commentEn || ''}`;
        if (!norm(hay).includes(kw)) return false;
      }
      return true;
    }).sort((a, b) => (visitMap.get(b.visitId).date || '').localeCompare(visitMap.get(a.visitId).date || '') || a.takenAt - b.takenAt);
    dlg.querySelector('#sCount').textContent = `${res.length}件`;

    }).join('') + (res.length > 200 ? '<p class="hint">先頭200件を表示しています。条件を絞り込んでください。</p>' : '');
    hydrate(dlg.querySelector('#sRes'));
  };

    const b = ev.target.closest('[data-m="go"]'); if (!b) return;

  });
  run();

const RANK = { 1: 'Equipment No.', 2: '手動紐付け', 3: 'Equipment Name', 4: 'Location + Item', 5: 'Location', 9: 'その他' };
let cmpState = null;

async function openCompare(cur) {
  const vesselId = S.visit.vesselId;
  const visits = S.visits.filter(v => v.vesselId === vesselId && v.id !== S.visit.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const vmap = new Map(visits.map(v => [v.id, v]));
  const eq = eqById(cur.equipId);
  const rankOf = p => {
    const pe = eqById(p.equipId);
    if (eq && pe && (pe.id === eq.id || (eq.eqNo && pe.eqNo === eq.eqNo))) return 1;
    if ((cur.links || []).includes(p.id) || (p.links || []).includes(cur.id)) return 2;
    if (eq && pe && norm(pe.name) === norm(eq.name)) return 3;
    if (cur.loc && p.loc === cur.loc && p.items.some(i => cur.items.includes(i))) return 4;
    if (cur.loc && p.loc === cur.loc) return 5;
    return 9;
  };
  const cands = others.map(p => ({ p, r: rankOf(p), v: vmap.get(p.visitId) }));
  let showAll = false, sel = null, curImg = null, selImg = null;
  const c = $('#cmp');
  c.innerHTML = `<div class="pebar"><button data-x="close">閉じる</button><b>履歴・Before / After</b><label class="chk" style="color:#fff"><input type="checkbox" id="cmpAll">すべての過去写真</label></div>
    <div class="cmpbody"><div class="cmppair">
      <div class="cmpcol"><h4>BEFORE</h4><div class="cmpimg" id="cmpB"><span class="hint">右の一覧から選んでください</span></div><div class="cmpcap" id="cmpBc"></div></div>

    </div><div class="cmplist" id="cmpList"></div></div>`;
  c.hidden = false;
  const locName = id => S.locMap.get(id)?.name || '未振り分け';
  const cap = (p, v) => `${v ? `${v.date}　${v.port || ''}\n` : ''}${locName(p.loc)}${eqById(p.equipId) ? '　' + eqLabel(eqById(p.equipId)) : ''}\n${p.comment || ''}`;
  const paintInto = (box, img, p) => {
    if (!img) return;
    const dpr = window.devicePixelRatio || 1;
    const cv = renderEdited(img, p.edit, box.clientWidth * dpr, box.clientHeight * dpr);
    cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
    box.innerHTML = ''; box.appendChild(cv);
  };
  const onResize = () => { paintInto($('#cmpA'), curImg, cur); if (sel) paintInto($('#cmpB'), selImg, sel.p); };
  cmpState = { onResize };
  window.addEventListener('resize', onResize);
  const drawList = () => {
    const list = cands.filter(x => showAll || x.r < 9).sort((a, b) => a.r - b.r || (b.v.date || '').localeCompare(a.v.date || '') || a.p.takenAt - b.p.takenAt);
    let h = '';
    if (!visits.length) h = '<p class="empty">この船の過去の訪船がありません。</p>';
    else if (!list.length) h = `<p class="empty">一致する過去写真がありません。<br>「すべての過去写真」をオンにすると、手動で紐付けできます。</p>`;
    let lastV = null;
    for (const x of list.slice(0, 300)) {
      if (x.v.id !== lastV) { h += `<div class="cmpv">${esc(x.v.date)}　${esc(x.v.port || '')}</div>`; lastV = x.v.id; }
      const linked = (cur.links || []).includes(x.p.id);
      h += `<div class="cmpi ${sel && sel.p.id === x.p.id ? 'on' : ''}" data-x="pick" data-id="${x.p.id}"><img data-thumb="${x.p.id}" alt=""><div class="r"><span class="rk r${x.r}">${RANK[x.r]}</span><div>${esc(locName(x.p.loc))}</div><div class="hint">${esc((x.p.comment || '').slice(0, 30))}</div>
        <button data-x="link" data-id="${x.p.id}" style="margin-top:4px;padding:3px 8px;font-size:12px">${linked ? '紐付け解除' : '紐付ける'}</button></div></div>`;
    }
    const box = $('#cmpList'); box.innerHTML = h; hydrate(box);

  };

    if (sel !== x) return;
    selImg = img; paintInto($('#cmpB'), img, x.p);
  };
  c.onclick = async ev => {
    const b = ev.target.closest('[data-x]'); if (!b) return;

    const x = cands.find(y => y.p.id === b.dataset.id);
    if (b.dataset.x === 'link') {
      ev.stopPropagation();

      if (on) { cur.links.push(x.p.id); x.p.links.push(cur.id); }
      await Store.putPhoto(cur); await Store.putPhoto(x.p);
      x.r = rankOf(x.p);

  if (first) pick(first);
}

  const T = k => esc(trl(k, lang));

    .sort((a, b) => order.get(a.loc) - order.get(b.loc) || a.takenAt - b.takenAt);

  const urls = new Map();
  const needBA = new Set();
  // 前回写真（手動紐付け）の Before 表示

      const o = await Store.getPhoto(lid);

  for (let i = 0; i < all.length; i++) {
    const [id, p] = all[i];
    $('#pText').textContent = `レポートを作成中 ${i + 1} / ${all.length}枚`;
    $('#pBar').style.width = `${(i / Math.max(1, all.length)) * 100}%`;
    try {
      const img = await loadImg(await fullURL(id));
      const u = URL.createObjectURL(await canvasBlob(renderEdited(img, p.edit, 1100), 0.82));
      urls.set(id, u); rpURLs.push(u);
    } catch (e) { /* 画像なしで続行 */ }
  }
  prog.hidden = true;

  const cols = r.cols === 3 ? 'c3' : 'c2';
  const locName = id => S.locMap.get(id)?.name || '';
  const card = p => {
    const e = eqById(p.equipId), ba = beforeOf.get(p.id);
    const img = u => u ? `<img src="${u}" alt="">` : '';
    const pic = ba ? `<div class="ba"><div><div class="lbl">${T('before')} ${esc(ba.ov.date)}</div><div class="img">${img(urls.get(ba.o.id))}</div></div><div><div class="lbl">${T('after')}</div><div class="img">${img(urls.get(p.id))}</div></div></div>` : `<div class="img">${img(urls.get(p.id))}</div>`;
    const comment = lang === 'en' ? (p.commentEn || p.comment) : lang === 'ja' ? p.comment : [p.comment, p.commentEn].filter(Boolean).join('\n');
    return `<div class="rp-card">${pic}<div class="cap"><div class="no">${esc(nums.get(p.id))}${p.major ? `<i>${T('major')}</i>` : ''}</div>
      <div><b>${esc(locName(p.loc))}</b>${e ? `　${esc(eqLabel(e))}` : ''}</div>
      ${p.items.length ? `<div class="rp-muted">${p.items.map(i => esc(itemLabel(i, lang))).join(' / ')}</div>` : ''}
      ${comment ? `<div class="rp-text" style="margin:1mm 0 0">${esc(comment)}</div>` : ''}</div></div>`;
  };
  const grid = list => list.length ? `<div class="rp-grid ${cols}">${list.map(card).join('')}</div>` : `<p class="rp-muted">${T('none')}</p>`;
  const row = (k, val) => val ? `<tr><th>${T(k)}</th><td>${esc(val)}</td></tr>` : '';
  const particulars = `${row('vessel', v.vesselName)}${row('imo', vs.imo)}${row('flag', vs.flag)}${row('cls', vs.cls)}${row('port', v.port)}${row('date', v.date)}${row('inspector', r.inspector)}${row('attendees', r.attendees)}${row('purpose', r.purpose)}`;
  let n = 0;
  const head = k => `<h2>${++n}. ${T(k)}</h2>`;
  let h = '';
  let first = true;
  const sec = (k, inner) => { if (!secs.includes(k)) return; h += `<section class="rp-sec ${first ? 'cont' : ''} ${['s3', 's7', 's8'].includes(k) ? 'cont' : ''}">${head(k)}${inner}</section>`; first = false; };

  if (secs.includes('s1')) {
    n++;
    h += `<section class="rp-cover"><div class="kicker">${T('title')}</div><h1>${esc(v.vesselName)}</h1><div class="sub">${esc(v.date)}${v.port ? '　' + esc(v.port) : ''}</div><div class="rp-rule"></div>
      <table class="rp-t">${particulars}</table><div class="rp-foot">${T('issued')}: ${esc(todayStr())}</div></section>`;
  }
  const majors = photos.filter(p => p.major), goods = photos.filter(p => p.items.includes('good-practice'));
  sec('s2', `<table class="rp-t">${particulars}</table>
    <table class="rp-t list"><thead><tr><th>${T('area')}</th><th>${T('photos')}</th><th>${T('majors')}</th></tr></thead><tbody>
    ${CATS.map(c => { const ps = photos.filter(p => S.locMap.get(p.loc).cat === c.id); return ps.length ? `<tr><td>${esc(c.name)}</td><td>${ps.length}</td><td>${ps.filter(p => p.major).length || '-'}</td></tr>` : ''; }).join('')}
    <tr><th>${T('total')}</th><th>${photos.length}</th><th>${majors.length || '-'}</th></tr></tbody></table>`);
  sec('s3', `<p class="rp-text">${esc(pickText(r.summaryJa, r.summaryEn, lang)) || `<span class="rp-muted">${T('none')}</span>`}</p>`);
  sec('s4', majors.length ? `<table class="rp-t list"><thead><tr><th>${T('no')}</th><th>${T('photoNo')}</th><th>${T('location')}</th><th>${T('comment')}</th></tr></thead><tbody>
      ${majors.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(nums.get(p.id))}</td><td>${esc(locName(p.loc))}${eqById(p.equipId) ? '<br>' + esc(eqLabel(eqById(p.equipId))) : ''}</td><td class="rp-text">${esc(lang === 'en' ? (p.commentEn || p.comment) : lang === 'ja' ? p.comment : [p.comment, p.commentEn].filter(Boolean).join('\n'))}</td></tr>`).join('')}
      </tbody></table>${grid(majors)}` : `<p class="rp-muted">${T('none')}</p>`);
  if (secs.includes('s5')) {
    let inner = '';
    for (const c of CATS) {
      const ps = photos.filter(p => S.locMap.get(p.loc).cat === c.id);
      if (!ps.length) continue;
      inner += `<h3>${esc(c.name)}</h3>`;
      const byLoc = new Map();
      for (const p of ps) { if (!byLoc.has(p.loc)) byLoc.set(p.loc, []); byLoc.get(p.loc).push(p); }
      for (const [lid, arr] of byLoc) inner += `<h4>${esc(locName(lid))}</h4>${grid(arr)}`;
    }
    sec('s5', inner || `<p class="rp-muted">${T('none')}</p>`);
  }
  sec('s6', grid(goods));
  sec('s7', `<p class="rp-text">${esc(pickText(r.remarksJa, r.remarksEn, lang)) || `<span class="rp-muted">${T('none')}</span>`}</p>`);
  const atts = String(r.attachments || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  sec('s8', atts.length ? `<ol>${atts.map(a => `<li>${esc(a)}</li>`).join('')}</ol>` : `<p class="rp-muted">${T('none')}</p>`);

  const rp = $('#rp');
  rp.innerHTML = `<div class="rpbar"><button data-r="close">閉じる</button><b>レポート プレビュー（${lang === 'ja' ? '日本語' : lang === 'en' ? 'English' : '日英併記'}）</b><button data-r="settings">設定</button><button class="primary" data-r="print">印刷 / PDF保存</button></div><div class="rp-doc">${h}</div>`;
  rp.hidden = false; rp.scrollTop = 0;
  document.title = `${safeName(v.vesselName)}_${(v.date || '').replace(/-/g, '')}_VisitReport`;
  rp.onclick = ev => {
    const b = ev.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === 'close') closeReport();
    else if (b.dataset.r === 'settings') { closeReport(); openReportSettings(); }
    else if (b.dataset.r === 'print') {
      const imgs = [...rp.querySelectorAll('img')];
      Promise.all(imgs.map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; }))).then(() => window.print());
    }
  };
}

/* ================= バックアップ ================= */
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
function dataURLToBlob(d) {
  const [h, b64] = d.split(',');
  const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function openBackup() {
  const dlg = openModal({
    title: 'バックアップ',
    body: `<h4 style="margin:0 0 6px">書き出し</h4>
      <p class="hint" style="margin-top:0">表示中の訪船（写真・編集内容・船マスタ・Equipment）を1つのファイルに保存します。OneDriveやTeamsに置けば、別の端末で「読み込み」できます。</p>
      ${S.visit ? `<p><b>${esc(visitLabel(S.visit))}</b>（写真 ${S.photos.length}枚）</p><p><label class="chk"><input type="checkbox" id="bkOrig" checked>元写真を含める（ファイルが大きくなります）</label></p><p><button class="primary" data-m="export">書き出す</button></p>` : '<p class="hint">訪船を選択してください。</p>'}
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h4 style="margin:0 0 6px">読み込み</h4>
      <p class="hint" style="margin-top:0">書き出したファイルを読み込みます。同じ写真がすでにある場合は読み込みません。</p>
      <label class="btn">ファイルを選ぶ<input type="file" id="bkFile" accept=".json,application/json" hidden></label>`,
    footer: '<span class="sp"></span><button data-act="close">閉じる</button>'
  });
  dlg.addEventListener('click', async ev => {
    if (!ev.target.closest('[data-m="export"]')) return;
    const withOrig = dlg.querySelector('#bkOrig').checked;
    const v = S.visit, prog = $('#progress');
    prog.hidden = false;
    const parts = [`{"format":"housen-photo-backup","version":1,"exportedAt":${Date.now()},"vessel":${JSON.stringify(S.vessel)},"visit":${JSON.stringify(v)},"equipment":${JSON.stringify(S.equip)},"photos":[`];
    for (let i = 0; i < S.photos.length; i++) {
      const p = S.photos[i];
      $('#pText').textContent = `書き出し中 ${i + 1} / ${S.photos.length}枚`;
      $('#pBar').style.width = `${(i / S.photos.length) * 100}%`;
      const blobs = {};
      for (const k of withOrig ? ['o', 'f', 't'] : ['f', 't']) { const b = await Store.getBlob(p.id + ':' + k); if (b) blobs[k] = await blobToDataURL(b); }
      parts.push((i ? ',' : '') + JSON.stringify({ ...p, _blobs: blobs }));
    }
    parts.push(']}');
    prog.hidden = true;
    await download(new Blob(parts, { type: 'application/json' }), `${safeName(v.vesselName)}_${(v.date || '').replace(/-/g, '')}_housen.json`);
  });
  dlg.querySelector('#bkFile').addEventListener('change', async ev => {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    const prog = $('#progress');
    prog.hidden = false; $('#pText').textContent = 'ファイルを読み込み中'; $('#pBar').style.width = '0';
    try {
      const data = JSON.parse(await f.text());
      if (data.format !== 'housen-photo-backup') throw new Error('format');
      const vs = data.vessel, vi = data.visit;
      const exV = S.vessels.find(x => x.id === vs.id);
      if (!exV || (vs.updatedAt || 0) > (exV.updatedAt || 0)) {
        normalizeVessel(vs); await Store.putVessel(vs);
        if (exV) Object.assign(exV, vs); else S.vessels.push(vs);
      }
      const exEq = new Map((await Store.listEquip(vs.id)).map(e => [e.id, e]));
      for (const e of data.equipment || []) if (!exEq.has(e.id) || (e.updatedAt || 0) > (exEq.get(e.id).updatedAt || 0)) await Store.putEquip(e);
      if (!S.visits.some(x => x.id === vi.id)) { await Store.putVisit(vi); S.visits.push(vi); }
      let added = 0, skipped = 0;
      for (let i = 0; i < data.photos.length; i++) {
        const { _blobs, ...p } = data.photos[i];
        $('#pText').textContent = `読み込み中 ${i + 1} / ${data.photos.length}枚`;
        $('#pBar').style.width = `${(i / data.photos.length) * 100}%`;
        if (await Store.getPhoto(p.id)) { skipped++; continue; }
        for (const [k, d] of Object.entries(_blobs || {})) await Store.putBlob(p.id + ':' + k, dataURLToBlob(d));
        await Store.putPhoto(p); added++;
      }
      prog.hidden = true;
      closeModal();
      await openVisit(vi.id);
      toast(`${added}枚を読み込みました${skipped ? `（既存の${skipped}枚は省略）` : ''}`);
    } catch (e) {
      prog.hidden = true;
      alert('読み込めませんでした。Housen Photo で書き出したファイルか確認してください。');
    }
  });
}

/* ================= イベント ================= */
function bind() {
  document.addEventListener('click', e => {
    if (!$('#menu').hidden && !e.target.closest('#menu')) { $('#menu').hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); }
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.closest('#menu')) { $('#menu').hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); }
    const a = t.dataset.act;
    switch (a) {
      case 'toggle': toggle(t.dataset.id); break;
      case 'view': e.stopPropagation(); openViewer(unassigned().map(x => x.id), t.dataset.id); break;
      case 'cell':
        if (S.selected.size) assignCell(t.dataset.l, t.dataset.i);
        else if (S.cellMap.get(t.dataset.l + '|' + t.dataset.i)?.length) openCell(t.dataset.l, t.dataset.i);
        else toast('このマスにはまだ写真がありません。未振り分けの写真を選んでからタップすると振り分けられます');
        break;
      case 'ctab': S.catTab = t.dataset.tab; renderMatrix(); $('#matrixPane').querySelector('.mwrap')?.scrollTo(0, 0); break;
      case 'showAllLocs': S.onlyFilled = false; renderMatrix(); break;
      case 'todo': {
        const ids = S.photos.filter(needsInput).sort((a, b) => a.takenAt - b.takenAt).map(p => p.id);
        if (ids.length) openViewer(ids, ids[0], null, { queue: true });
        break;
      }
      case 'ich': t.classList.toggle('on'); break;
      case 'clearSel': S.selected.clear(); render(); break;
      case 'assign': openAssign([...S.selected]); break;
      case 'tab': S.tab = t.dataset.tab; render(); break;
      case 'new': openNewVisit(); break;
      case 'visitInfo': openVisitInfo(); break;
      case 'vessels': openVessels(); break;
      case 'equip': openEquipment(); break;
      case 'search': openSearch(); break;
      case 'backup': openBackup(); break;
      case 'report': openReportSettings(); break;
      case 'menu': { const m = $('#menu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); e.stopPropagation(); return; }
      case 'shoot': openCam(); break;
      case 'close': closeModal(); break;
    }
  });
  document.addEventListener('change', e => { if (e.target.id === 'onlyFilled') { S.onlyFilled = e.target.checked; renderMatrix(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#pe').hidden) return;
      if (!$('#menu').hidden) { $('#menu').hidden = true; return; }
      if (!$('#cmp').hidden) { closeCompare(); return; }
      if (!$('#rp').hidden) { closeReport(); return; }
      if (!$('#cam').hidden) { if (!$('#camLp').hidden) $('#camLp').hidden = true; else if (!$('#camSheet').hidden) hideSheet(); else exitCam(); return; }
      closeModal();
    }
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.classList?.contains('th')) { e.preventDefault(); toggle(t.dataset.id); }
  });
  $('#tray').addEventListener('change', e => {
    const g = e.target.dataset.g; if (g === undefined) return;
    S.groups[+g].items.forEach(x => e.target.checked ? S.selected.add(x.id) : S.selected.delete(x.id));
    render();
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  $('#visitSel').addEventListener('change', e => openVisit(e.target.value));
  $('#gapIn').addEventListener('input', e => { S.gapMin = +e.target.value; $('#gapVal').textContent = S.gapMin; renderTray(); });
  $('#fileLbl').addEventListener('click', e => { if (!S.visit) { e.preventDefault(); openNewVisit(); } });
  $('#fileIn').addEventListener('change', async e => { await importFiles(e.target.files); e.target.value = ''; });
  let dragN = 0;
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('#dropHint').hidden = false; } });
  window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#dropHint').hidden = true; } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dropHint').hidden = true; if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });
}


/* ---- Webアプリ（ホーム画面）用 ---- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker?.register('./sw.js').catch(() => {}); });
}
// 端末のストレージが自動削除されないよう永続化を依頼
navigator.storage?.persist?.().catch(() => {});

(async function boot() {
  const ok = await Store.init();
  if (!ok) {
    const n = $('#notice');
    n.hidden = false;
    n.textContent = 'この環境では端末に保存できないため、ページを閉じるとデータが消えます。';
  }
  S.vessels = await Store.listVessels();
  for (const v of S.vessels) if (normalizeVessel(v)) await Store.putVessel(v);
  if (!S.vessels.length) {
    // 初期登録（設備構成は仮の値。船マスタで実船に合わせて修正すること）
    for (const [name, flag] of [['LIMONE', 'Panama'], ['OCEAN RALLY', 'Liberia'], ['ORIENTAL BEAUTY', 'Panama']]) {
      const v = newVessel(name); v.flag = flag;
      await Store.putVessel(v); S.vessels.push(v);
    }
  }
  S.visits = await Store.listVisits();
  bind();
  bindCam();
  const first = sortedVisits()[0];
  if (first) await openVisit(first.id); else render();
})();
</script>
